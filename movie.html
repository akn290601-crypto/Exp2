<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TOKIWA</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  video {
    width:100%; height:100%;
    object-fit:contain;
    background:#000;
  }
  #endOverlay {
    display:none;
    position:fixed; inset:0;
    background:#000;
    align-items:center; justify-content:center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:3.5rem; font-weight:900;
    color:#fff; letter-spacing:0.4em;
    text-shadow:0 0 30px rgba(255,255,255,0.6);
  }
  #endOverlay.show { display:flex; }
</style>
</head>
<body>
<video id="mv" src="movie2.mp4" autoplay playsinline webkit-playsinline></video>
<div id="endOverlay">END</div>
<script>
  const mv = document.getElementById('mv');
  const overlay = document.getElementById('endOverlay');

  function goResult() {
    overlay.classList.add('show');
    setTimeout(() => { window.location.href = 'index.html?result=1'; }, 2000);
  }

  mv.addEventListener('ended', goResult);
  mv.addEventListener('error', goResult);

  // フォールバック: 再生できなかった場合も3秒後に遷移
  const fallback = setTimeout(goResult, 180000);
  mv.addEventListener('ended', () => clearTimeout(fallback));

  // タップでスキップ
  document.addEventListener('pointerdown', () => {
    if (!overlay.classList.contains('show')) goResult();
  }, { once: true });
</script>
</body>
</html>
