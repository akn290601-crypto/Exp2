<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>タップゲーム</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0c29;
      min-height: 100dvh;
      overflow: hidden;
      color: #fff;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px env(safe-area-inset-bottom);
      overflow-y: auto;
    }
    .screen.hidden { display: none; }

    /* ── Name screen ── */
    .logo { font-size: 3rem; margin-bottom: 8px; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
    .sub { color: #aaa; font-size: 0.9rem; margin-bottom: 28px; text-align: center; line-height: 1.6; }

    input[type="text"] {
      width: 100%;
      max-width: 280px;
      padding: 14px 18px;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    input[type="text"]::placeholder { color: #555; }
    input[type="text"]:focus { border-color: #f7971e; }

    .hero-preview-wrap {
      width: 100%;
      max-width: 280px;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hero-preview-wrap img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .hero-preview-text { font-size: 0.85rem; color: #ccc; line-height: 1.5; }
    .hero-preview-text strong { color: #f7971e; display: block; }

    .btn {
      padding: 14px 36px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary   { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a1a; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 2px solid rgba(255,255,255,0.2); }

    /* ── Leaderboard ── */
    .lb-wrap { width: 100%; max-width: 280px; margin-top: 24px; }
    .lb-title { text-align: center; font-size: 0.8rem; color: #ffd200; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
    .lb-empty { text-align: center; color: #555; font-size: 0.85rem; }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
    }
    .lb-medal { font-size: 1.2rem; width: 26px; text-align: center; flex-shrink: 0; }
    .lb-name  { flex: 1; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-time  { color: #ffd200; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; }

    /* ── Game screen ── */
    #gameScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #1b1b3a 0%, #0f0c29 100%);
      overflow: hidden;
      touch-action: none;
    }
    .game-hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 20px;
      padding-top: max(12px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }
    .hud-timer  { font-size: 1.6rem; font-weight: 800; color: #ffd200; font-variant-numeric: tabular-nums; }
    .hud-remain { font-size: 0.9rem; color: #aaa; }

    /* ── Tap items ── */
    .tap-item {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform-origin: center;
      -webkit-tap-highlight-color: transparent;
      border-radius: 12px;
    }
    .tap-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      pointer-events: none;
      display: block;
    }

    /* 色変化オーバーレイ */
    .tap-overlay {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1;
    }
    /* 1回目：黄色く光る */
    .tap-item.stage-1 .tap-overlay {
      background: rgba(255, 210, 0, 0.5);
      opacity: 1;
      box-shadow: 0 0 20px 6px rgba(255, 210, 0, 0.7);
    }
    /* 2回目：赤く光る＋点滅 */
    .tap-item.stage-2 .tap-overlay {
      background: rgba(255, 40, 0, 0.55);
      opacity: 1;
      box-shadow: 0 0 28px 8px rgba(255, 40, 0, 0.8);
      animation: danger-pulse 0.22s ease-in-out infinite alternate;
    }

    @keyframes danger-pulse {
      from { opacity: 0.85; }
      to   { opacity: 1; }
    }

    /* タップ時の弾むフィードバック */
    @keyframes pop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .tap-item.popping { animation: pop 0.16s ease; }

    /* 3回目：一瞬縮む */
    .tap-item.pre-burst {
      transform: scale(0.55) !important;
      transition: transform 0.14s ease-in !important;
      pointer-events: none;
    }

    /* 破裂アニメーション（縮んだ状態から膨張して消える） */
    @keyframes burst {
      0%   { transform: scale(0.55) rotate(0deg);  opacity: 1; }
      30%  { transform: scale(1.7) rotate(8deg);   opacity: 0.9; }
      65%  { transform: scale(2.2) rotate(-6deg);  opacity: 0.4; }
      100% { transform: scale(0.3) rotate(12deg);  opacity: 0; }
    }
    .tap-item.bursting {
      animation: burst 0.42s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      pointer-events: none;
      z-index: 5;
    }

    /* パーティクル */
    @keyframes particle-fly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      animation: particle-fly 0.55s ease-out forwards;
    }

    /* 結果画面 */
    .result-time { font-size: 3.5rem; font-weight: 900; color: #ffd200; margin: 12px 0 4px; }
    .result-rank { font-size: 1rem; color: #aaa; margin-bottom: 20px; }
    .btn-row { display: flex; gap: 12px; margin-top: 20px; }
  </style>
</head>
<body>

<!-- ① 名前入力 -->
<div class="screen" id="nameScreen">
  <div class="logo">⚡</div>
  <h1>タップゲーム</h1>
  <p class="sub">画像を3回タップして破裂させろ！<br>速さを競え！</p>

  <input type="text" id="nameInput" placeholder="プレイヤー名を入力"
    maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

  <div class="hero-preview-wrap hidden" id="heroPreviewWrap">
    <img id="heroThumb" src="" alt="hero">
    <div class="hero-preview-text">
      <strong>画像読み込み済み</strong>
      この画像がタップ対象になります
    </div>
  </div>

  <button class="btn btn-primary" id="startBtn">ゲームスタート</button>
  <div class="lb-wrap" id="topLb"></div>
</div>

<!-- ② ゲーム -->
<div class="screen hidden" id="gameScreen">
  <div class="game-hud">
    <div class="hud-timer"  id="hudTimer">0.00</div>
    <div class="hud-remain" id="hudRemain">残り 8個</div>
  </div>
</div>

<!-- ③ リザルト -->
<div class="screen hidden" id="resultScreen">
  <div class="logo">🎉</div>
  <h1>クリア！</h1>
  <div class="result-time" id="resTime"></div>
  <div class="result-rank" id="resRank"></div>
  <div class="lb-wrap" id="resLb"></div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="backBtn">トップへ</button>
    <button class="btn btn-primary"   id="retryBtn">もう一度</button>
  </div>
</div>

<script>
  'use strict';

  const EMOJIS   = ['🍎','🍊','🍋','🍇','🍓','🍉','🍑','🌟','🎯','🦋','🌸','🎪','🍄','🎨','🌈'];
  const TOTAL    = 8;
  const TAPS_MAX = 3;
  const SIZE     = 120;   // 固定サイズ（縮まない）
  const MEDALS   = ['🥇','🥈','🥉'];
  const HERO_SRC = 'IMG_3716.png';

  let playerName = '';
  let heroImgSrc = null;
  let startTime  = null;
  let rafId      = null;
  let remaining  = 0;
  let active     = false;

  const $name   = document.getElementById('nameScreen');
  const $game   = document.getElementById('gameScreen');
  const $result = document.getElementById('resultScreen');

  function showScreen(el) {
    [$name, $game, $result].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  /* ── 画像自動ロード ── */
  function tryLoadHero() {
    return new Promise(resolve => {
      const img = new Image();
      img.onload  = () => resolve(img.src);
      img.onerror = () => resolve(null);
      img.src = HERO_SRC;
    });
  }

  /* ── スコア ── */
  function loadScores() {
    try { return JSON.parse(localStorage.getItem('tg_v1') || '[]'); } catch { return []; }
  }
  function saveScore(name, time) {
    const list = loadScores();
    list.push({ name, time });
    list.sort((a, b) => a.time - b.time);
    localStorage.setItem('tg_v1', JSON.stringify(list.slice(0, 20)));
  }
  function rankOf(time) {
    return loadScores().filter(s => s.time < time).length + 1;
  }
  function renderLb(id) {
    const el  = document.getElementById(id);
    const top = loadScores().slice(0, 3);
    if (!top.length) {
      el.innerHTML = '<div class="lb-title">🏆 ベスト 3</div><div class="lb-empty">まだ記録なし</div>';
      return;
    }
    el.innerHTML = '<div class="lb-title">🏆 ベスト 3</div>' +
      top.map((s, i) =>
        `<div class="lb-row">
           <span class="lb-medal">${MEDALS[i]}</span>
           <span class="lb-name">${esc(s.name)}</span>
           <span class="lb-time">${s.time.toFixed(2)}s</span>
         </div>`
      ).join('');
  }
  function esc(s) {
    return s.replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ── 名前画面 ── */
  const AUDIO_FILE = 'start.mp3';

  document.getElementById('startBtn').addEventListener('click', () => {
    const v = document.getElementById('nameInput').value.trim();
    if (!v) { document.getElementById('nameInput').focus(); return; }
    playerName = v;
    // iOSはユーザー操作と同一タスク内でnew Audio().play()する必要がある
    const audio = new Audio(AUDIO_FILE);
    audio.play().catch(() => {});
    startGame();
  });
  document.getElementById('nameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('startBtn').click();
  });

  /* ── タイマー ── */
  function tickTimer() {
    if (startTime)
      document.getElementById('hudTimer').textContent =
        ((Date.now() - startTime) / 1000).toFixed(2);
    rafId = requestAnimationFrame(tickTimer);
  }
  function stopTimer() { cancelAnimationFrame(rafId); rafId = null; }

  /* ── 破裂パーティクル ── */
  function createBurst(el) {
    const rect     = el.getBoundingClientRect();
    const gameRect = $game.getBoundingClientRect();
    const cx = rect.left - gameRect.left + rect.width  / 2;
    const cy = rect.top  - gameRect.top  + rect.height / 2;

    const colors = ['#ff4400','#ff8800','#ffdd00','#ff2200','#ffaa00','#ffffff','#ff66aa'];
    const count  = 14;

    for (let i = 0; i < count; i++) {
      const p     = document.createElement('div');
      p.className = 'particle';
      const angle = (i / count) * Math.PI * 2;
      const dist  = 55 + Math.random() * 65;
      const sz    = 7 + Math.random() * 9;
      const color = colors[Math.floor(Math.random() * colors.length)];
      p.style.cssText =
        `width:${sz}px;height:${sz}px;background:${color};` +
        `left:${cx - sz / 2}px;top:${cy - sz / 2}px;` +
        `--dx:${(Math.cos(angle) * dist).toFixed(1)}px;` +
        `--dy:${(Math.sin(angle) * dist).toFixed(1)}px;`;
      $game.appendChild(p);
      setTimeout(() => p.remove(), 650);
    }
  }

  /* ── ゲーム開始 ── */
  function startGame() {
    $game.querySelectorAll('.tap-item, .particle').forEach(e => e.remove());

    remaining = TOTAL;
    startTime = null;
    active    = false;
    stopTimer();

    document.getElementById('hudTimer').textContent  = '0.00';
    document.getElementById('hudRemain').textContent = `残り ${TOTAL}個`;

    showScreen($game);

    const hudH   = $game.querySelector('.game-hud').offsetHeight || 56;
    const margin = 20;
    const W      = window.innerWidth;
    const H      = window.innerHeight;

    for (let i = 0; i < TOTAL; i++) {
      const el = document.createElement('div');
      el.className = 'tap-item';
      el.style.width  = SIZE + 'px';
      el.style.height = SIZE + 'px';

      /* オーバーレイ（色変化用） */
      const overlay = document.createElement('div');
      overlay.className = 'tap-overlay';
      el.appendChild(overlay);

      if (heroImgSrc) {
        const img = document.createElement('img');
        img.src       = heroImgSrc;
        img.draggable = false;
        el.appendChild(img);
      } else {
        el.style.fontSize   = SIZE * 0.7 + 'px';
        el.style.lineHeight = '1';
        el.insertAdjacentText('beforeend', EMOJIS[i % EMOJIS.length]);
      }

      const x = margin + Math.random() * Math.max(0, W - margin * 2 - SIZE);
      const y = hudH + margin + Math.random() * Math.max(0, H - hudH - margin * 2 - SIZE);
      el.style.left = x + 'px';
      el.style.top  = y + 'px';

      let taps = 0;

      el.addEventListener('click', () => {
        if (el.classList.contains('bursting')) return;

        if (!active) {
          active    = true;
          startTime = Date.now();
          rafId     = requestAnimationFrame(tickTimer);
        }

        taps++;

        if (taps >= TAPS_MAX) {
          /* 縮んでから破裂 */
          el.classList.remove('stage-1', 'stage-2');
          el.classList.add('pre-burst');
          setTimeout(() => {
            createBurst(el);
            el.classList.remove('pre-burst');
            el.classList.add('bursting');
            setTimeout(() => el.remove(), 430);
          }, 160);

          remaining--;
          document.getElementById('hudRemain').textContent = `残り ${remaining}個`;
          if (remaining <= 0) {
            stopTimer();
            const elapsed = (Date.now() - startTime) / 1000;
            setTimeout(() => showResult(elapsed), 480);
          }
        } else {
          /* 色変化 */
          el.classList.remove('stage-1', 'stage-2', 'popping');
          el.classList.add(`stage-${taps}`);
          void el.offsetWidth;
          el.classList.add('popping');
          el.addEventListener('animationend', () => el.classList.remove('popping'), { once: true });
        }
      });

      $game.appendChild(el);
    }
  }

  /* ── リザルト ── */
  function showResult(elapsed) {
    const rank = rankOf(elapsed);
    saveScore(playerName, elapsed);

    document.getElementById('resTime').textContent = elapsed.toFixed(2) + 's';
    const labels = { 1:'🥇 1位！最速！', 2:'🥈 2位！', 3:'🥉 3位！' };
    document.getElementById('resRank').textContent = labels[rank] || 'タイム記録！';

    renderLb('resLb');
    showScreen($result);
  }

  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('backBtn').addEventListener('click', () => {
    renderLb('topLb');
    showScreen($name);
  });

  /* ── 起動時 ── */
  (async () => {
    renderLb('topLb');
    heroImgSrc = await tryLoadHero();
    if (heroImgSrc) {
      document.getElementById('heroThumb').src = heroImgSrc;
      document.getElementById('heroPreviewWrap').classList.remove('hidden');
    }
  })();
</script>
</body>
</html>
