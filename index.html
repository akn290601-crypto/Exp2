<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>トキワ帝国の野望</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0c29;
      min-height: 100dvh;
      overflow: hidden;
      color: #fff;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px env(safe-area-inset-bottom);
      overflow-y: auto;
    }
    .screen.hidden { display: none; }

    #nameScreen {
      background: radial-gradient(ellipse at center, #6b0f0f 0%, #3a0505 60%, #1e0202 100%);
    }

    .logo { font-size: 3rem; margin-bottom: 8px; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
    .title-logo {
      width: min(320px, 88vw);
      height: auto;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 24px rgba(0,0,0,0.7));
    }
    .sub { color: #aaa; font-size: 0.9rem; margin-bottom: 28px; text-align: center; line-height: 1.6; }

    .btn {
      padding: 14px 36px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary   { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a1a; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 2px solid rgba(255,255,255,0.2); }

    /* ── Leaderboard ── */
    .lb-wrap { width: 100%; max-width: 280px; margin-top: 24px; }
    .lb-title { text-align: center; font-size: 0.8rem; color: #ffd200; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
    .lb-empty { text-align: center; color: #555; font-size: 0.85rem; }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
    }
    .lb-medal { font-size: 1.2rem; width: 26px; text-align: center; flex-shrink: 0; }
    .lb-name  { flex: 1; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { color: #ffd200; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; }

    /* ── Game screen ── */
    #gameScreen {
      position: fixed;
      inset: 0;
      background: url('IMG_3753.png') center center / cover no-repeat, #000;
      overflow: hidden;
      touch-action: none;
    }

    @keyframes shake {
      0%,100% { transform: translate(0,0) rotate(0deg); }
      20%     { transform: translate(-6px, 3px) rotate(-0.5deg); }
      40%     { transform: translate( 6px,-3px) rotate( 0.5deg); }
      60%     { transform: translate(-4px, 2px) rotate(-0.3deg); }
      80%     { transform: translate( 4px,-2px) rotate( 0.3deg); }
    }
    #gameScreen.shaking { animation: shake 0.3s ease; }

    #clearFlash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }
    @keyframes flash {
      0%   { opacity: 0; }
      30%  { opacity: 0.75; }
      100% { opacity: 0; }
    }
    #clearFlash.flashing { animation: flash 0.4s ease-out forwards; }

    .game-hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 8px 14px;
      padding-top: max(8px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }
    /* カウントダウン */
    .hud-timer {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffd200;
      font-variant-numeric: tabular-nums;
      transition: color 0.4s;
      flex-shrink: 0;
    }
    .hud-timer.orange { color: #ff8c00; }
    .hud-timer.red    { color: #ff2200; animation: timer-blink 0.35s ease-in-out infinite alternate; }
    @keyframes timer-blink { from { opacity:1; } to { opacity:0.4; } }

    /* スコア表示 */
    .hud-right  { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0; }
    .hud-score  { font-size: 0.75rem; font-weight: 700; color: #ffd200; white-space: nowrap; }
    .hud-remain { font-size: 0.95rem; font-weight: 900; color: #ff6633; white-space: nowrap; }

    /* カウントダウン */
    #countdown {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      pointer-events: none;
    }
    @keyframes cd-pop {
      0%   { transform: scale(2.5); opacity: 0; }
      25%  { transform: scale(1);   opacity: 1; }
      75%  { transform: scale(1);   opacity: 1; }
      100% { transform: scale(0.4); opacity: 0; }
    }
    .cd-num {
      position: absolute;
      font-size: 7rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px #ffd200, 0 0 60px #ffd200;
      animation: cd-pop 0.85s ease-out forwards;
    }
    .cd-go {
      font-size: 5rem;
      color: #ff4400;
      text-shadow: 0 0 30px #ff8800, 0 0 60px #ff4400;
    }

    /* WIN / LOSE */
    .result-win  { color: #ffd200; text-shadow: 0 0 20px #ffd200; }
    .result-lose { color: #ff3300; text-shadow: 0 0 20px #ff3300; }



    /* スポーン演出 */
    @keyframes spawn-in {
      0%   { transform: scale(0.1) rotate(-20deg); opacity: 0; }
      65%  { transform: scale(1.18) rotate(4deg);  opacity: 1; }
      100% { transform: scale(1)   rotate(0deg);   opacity: 1; }
    }
    .tap-item.spawning { animation: spawn-in 0.22s cubic-bezier(0.34,1.56,0.64,1) forwards; }

/* ── Tap items ── */
    .tap-item {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform-origin: center;
      -webkit-tap-highlight-color: transparent;
      border-radius: 12px;
    }
    .tap-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      pointer-events: none;
      display: block;
    }
    .tap-overlay {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1;
    }
    .tap-item.stage-1 .tap-overlay {
      background: rgba(255,210,0,0.5);
      opacity: 1;
      box-shadow: 0 0 20px 6px rgba(255,210,0,0.7);
    }
    .tap-item.stage-2 .tap-overlay {
      background: rgba(255,40,0,0.55);
      opacity: 1;
      box-shadow: 0 0 28px 8px rgba(255,40,0,0.8);
      animation: danger-pulse 0.22s ease-in-out infinite alternate;
    }
    @keyframes danger-pulse { from { opacity:.85; } to { opacity:1; } }

    @keyframes pop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .tap-item.popping { animation: pop 0.16s ease; }

    .tap-item.pre-burst {
      transform: scale(0.55) !important;
      transition: transform 0.14s ease-in !important;
      pointer-events: none;
    }
    @keyframes burst {
      0%   { transform: scale(0.55) rotate(0deg);  opacity: 1; }
      30%  { transform: scale(1.7)  rotate(8deg);  opacity: 0.9; }
      65%  { transform: scale(2.2)  rotate(-6deg); opacity: 0.4; }
      100% { transform: scale(0.3)  rotate(12deg); opacity: 0; }
    }
    .tap-item.bursting {
      animation: burst 0.42s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes particle-fly {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity: 0; }
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      animation: particle-fly 0.55s ease-out forwards;
    }

    @keyframes shatter {
      0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0.2); opacity: 0; }
    }
    .shard {
      position: absolute;
      pointer-events: none;
      z-index: 16;
      overflow: hidden;
      border-radius: 3px;
      animation: shatter 0.52s ease-out forwards;
    }

    @keyframes float-up {
      0%   { transform: translateY(0)     scale(1);   opacity: 1; }
      60%  { transform: translateY(-40px) scale(1.1); opacity: 1; }
      100% { transform: translateY(-70px) scale(0.8); opacity: 0; }
    }
    .float-score {
      position: absolute;
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffd200;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      pointer-events: none;
      z-index: 20;
      animation: float-up 0.7s ease-out forwards;
    }
    .float-score.milestone {
      font-size: 3.6rem;
      color: #ff4400;
      text-shadow: 0 0 20px #ff8800, 0 0 40px #ff4400, 0 3px 8px rgba(0,0,0,0.8);
      animation: float-up 1s ease-out forwards;
    }

    /* 結果 */
    .result-score { font-size: 4rem; font-weight: 900; color: #ffd200; margin: 8px 0 2px; }
    .result-label { font-size: 1.1rem; color: #aaa; margin-bottom: 4px; }
    .result-rank  { font-size: 1rem;   color: #aaa; margin-bottom: 20px; }
    .btn-row { display: flex; gap: 12px; margin-top: 20px; }
  </style>
</head>
<body>

<!-- ① スタート -->
<div class="screen" id="nameScreen">
  <img src="logo_tokiwa.png" class="title-logo" alt="トキワ帝国の野望">
  <p class="sub">トキワ兵を30秒以内に全滅させろ！<br>触れるだけで撃破！</p>
  <button class="btn btn-primary" id="startBtn">ゲームスタート</button>
  <div class="lb-wrap" id="topLb"></div>
</div>

<!-- ② ゲーム -->
<div class="screen hidden" id="gameScreen">
  <div id="clearFlash"></div>
  <div id="countdown"></div>
  <div class="game-hud">
    <div class="hud-timer" id="hudTimer">30.00</div>
    <div class="hud-right">
      <div class="hud-score"  id="hudScore">💥 0体撃破</div>
      <div class="hud-remain" id="hudRemain">残り 99体</div>
    </div>
  </div>
</div>

<!-- ③ リザルト -->
<div class="screen hidden" id="resultScreen">
  <div class="logo" id="resLogo">🎉</div>
  <h1 id="resTitle"></h1>
  <div class="result-score" id="resScore"></div>
  <div class="result-label" id="resLabel"></div>
  <div class="result-rank"  id="resRank"></div>
  <div class="lb-wrap" id="resLb"></div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="backBtn">トップへ</button>
    <button class="btn btn-primary"   id="retryBtn">もう一度</button>
  </div>
</div>

<script>
  'use strict';

  const EMOJIS            = ['🍎','🍊','🍋','🍇','🍓','🍉','🍑','🌟','🎯','🦋','🌸','🎪','🍄','🎨','🌈'];
  const TAPS_MAX          = 1;
  const SIZE              = 90;
  const MEDALS            = ['🥇','🥈','🥉'];
  const HERO_SRCS         = ['IMG_3716.png','IMG_3754.png','IMG_3755.png','IMG_3756.png','IMG_3757.png'];
  const GAME_DURATION     = 30;
  const TOTAL_ITEMS       = 180;
  const SPAWN_INTERVAL_MS = 190;
  const INITIAL_SPAWN     = 5;

  let heroImgSrcs  = [];
  let score        = 0;
  let gameEndTime  = null;
  let rafId        = null;
  let gameOver     = false;
  let gameWon      = false;
  let itemIndex    = 0;
  let totalSpawned = 0;
  let spawnTimerId  = null;
  let startTime     = null;

  const $name   = document.getElementById('nameScreen');
  const $game   = document.getElementById('gameScreen');
  const $result = document.getElementById('resultScreen');

  function showScreen(el) {
    [$name, $game, $result].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  /* ── Audio ── */
  let audioCtx = null;
  function initAudio() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      audioCtx.resume().then(() => {
        const buf = audioCtx.createBuffer(1, 1, 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
      });
    } catch (_) {}
  }
  function getCtx() {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playHit(stage) {
    try {
      const ctx = getCtx(); if (!ctx) return;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(stage === 1 ? 180 : 260, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(stage === 1 ? 120 : 180, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
    } catch (_) {}
  }

  function playBurst(milestone) {
    try {
      const ctx = getCtx(); if (!ctx) return;
      const t = ctx.currentTime;

      // ノイズ（打撃感）
      const bufLen = ctx.sampleRate * 0.25;
      const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 1.5);
      const noise = ctx.createBufferSource();
      const nFilter = ctx.createBiquadFilter();
      const nGain = ctx.createGain();
      nFilter.type = 'bandpass'; nFilter.frequency.value = milestone ? 800 : 500; nFilter.Q.value = 0.8;
      noise.buffer = buf;
      noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(ctx.destination);
      nGain.gain.setValueAtTime(milestone ? 1.0 : 0.7, t);
      nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      noise.start(t);

      // ピッチダウン（ドスン感）
      const osc = ctx.createOscillator();
      const oGain = ctx.createGain();
      osc.connect(oGain); oGain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(milestone ? 280 : 180, t);
      osc.frequency.exponentialRampToValueAtTime(35, t + 0.2);
      oGain.gain.setValueAtTime(milestone ? 0.9 : 0.65, t);
      oGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t); osc.stop(t + 0.25);

      // マイルストーン追加音（高音アクセント）
      if (milestone) {
        const osc2 = ctx.createOscillator();
        const g2 = ctx.createGain();
        osc2.connect(g2); g2.connect(ctx.destination);
        osc2.type = 'square'; osc2.frequency.value = 880;
        g2.gain.setValueAtTime(0.3, t + 0.05);
        g2.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc2.start(t + 0.05); osc2.stop(t + 0.2);
      }
    } catch (_) {}
  }

  function playClear() {
    try {
      const ctx = getCtx(); if (!ctx) return;
      [523, 659, 784, 1047].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination); osc.type = 'triangle';
        const t = ctx.currentTime + i * 0.1;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.start(t); osc.stop(t + 0.25);
      });
    } catch (_) {}
  }

  /* ── エフェクト ── */
  function shakeScreen() {
    $game.classList.remove('shaking');
    void $game.offsetWidth;
    $game.classList.add('shaking');
    $game.addEventListener('animationend', () => $game.classList.remove('shaking'), { once: true });
  }

  function showFloatScore(cx, cy, count) {
    const isMilestone = count % 10 === 0;
    const el = document.createElement('div');
    el.className = 'float-score' + (isMilestone ? ' milestone' : '');
    el.textContent = count;
    const offset = isMilestone ? 40 : 24;
    el.style.left = (cx - offset) + 'px';
    el.style.top  = (cy - 30) + 'px';
    $game.appendChild(el);
    setTimeout(() => el.remove(), isMilestone ? 1050 : 750);
  }

  function createBurst(el) {
    const rect = el.getBoundingClientRect();
    const gr   = $game.getBoundingClientRect();
    const cx   = rect.left - gr.left + rect.width  / 2;
    const cy   = rect.top  - gr.top  + rect.height / 2;
    const colors = ['#ff4400','#ff8800','#ffdd00','#ff2200','#ffaa00','#ffffff','#ff66aa','#ffcc00','#ff0066'];
    for (let i = 0; i < 22; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (i / 22) * Math.PI * 2;
      const dist  = 65 + Math.random() * 90;
      const sz    = 8 + Math.random() * 12;
      p.style.cssText =
        `width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};` +
        `left:${cx-sz/2}px;top:${cy-sz/2}px;` +
        `--dx:${(Math.cos(angle)*dist).toFixed(1)}px;--dy:${(Math.sin(angle)*dist).toFixed(1)}px;`;
      $game.appendChild(p);
      setTimeout(() => p.remove(), 650);
    }
    return { cx, cy };
  }

  function createShatter(el) {
    const imgEl = el.querySelector('img');
    if (!imgEl) return;
    const rect  = el.getBoundingClientRect();
    const gr    = $game.getBoundingClientRect();
    const ex    = rect.left - gr.left;
    const ey    = rect.top  - gr.top;
    const iSize = parseInt(el.style.width) || SIZE;
    const cols  = 4, rows = 4;
    const fw    = iSize / cols;
    const fh    = iSize / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const shard = document.createElement('div');
        shard.className = 'shard';
        shard.style.width             = fw + 'px';
        shard.style.height            = fh + 'px';
        shard.style.left              = (ex + c * fw) + 'px';
        shard.style.top               = (ey + r * fh) + 'px';
        shard.style.backgroundImage   = `url(${imgEl.src})`;
        shard.style.backgroundSize    = `${iSize}px ${iSize}px`;
        shard.style.backgroundPosition= `-${(c * fw).toFixed(1)}px -${(r * fh).toFixed(1)}px`;
        const dx  = (c + 0.5) * fw - iSize / 2;
        const dy  = (r + 0.5) * fh - iSize / 2;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const spd = 55 + Math.random() * 85;
        shard.style.setProperty('--tx',  (dx / len * spd).toFixed(1) + 'px');
        shard.style.setProperty('--ty',  (dy / len * spd).toFixed(1) + 'px');
        shard.style.setProperty('--rot', (Math.random() * 400 - 200).toFixed(1) + 'deg');
        $game.appendChild(shard);
        setTimeout(() => shard.remove(), 580);
      }
    }
  }

/* ── タイマー ── */
  function tickTimer() {
    if (gameEndTime && !gameOver) {
      const left = Math.max(0, (gameEndTime - Date.now()) / 1000);
      const timerEl = document.getElementById('hudTimer');
      timerEl.textContent = left.toFixed(2);
      // 残り時間で色変化
      if (left <= 10)      { timerEl.classList.remove('orange'); timerEl.classList.add('red'); }
      else if (left <= 20) { timerEl.classList.remove('red');    timerEl.classList.add('orange'); }
      else                 { timerEl.classList.remove('orange','red'); }

      if (left <= 0) {
        gameOver = true;
        gameWon  = false;
        stopTimer();
        stopSpawn();
        endGame();
        return;
      }
    }
    rafId = requestAnimationFrame(tickTimer);
  }
  function stopTimer() { cancelAnimationFrame(rafId); rafId = null; }

  /* ── アイテム生成 ── */
  function spawnItem() {
    if (gameOver || totalSpawned >= TOTAL_ITEMS) return;
    totalSpawned++;

    const hudH         = $game.querySelector('.game-hud').offsetHeight || 56;
    const topMargin    = 20;
    const bottomMargin = 110;
    const W = window.innerWidth, H = window.innerHeight;

    const el = document.createElement('div');
    el.className = 'tap-item';

    const overlay = document.createElement('div');
    overlay.className = 'tap-overlay';
    el.appendChild(overlay);

    let itemSize = SIZE;
    if (heroImgSrcs.length > 0) {
      const src = heroImgSrcs[Math.floor(Math.random() * heroImgSrcs.length)];
      if (src === 'IMG_3716.png') itemSize = Math.round(SIZE * 1.28); // 一回り大きく
      else itemSize = Math.round(SIZE * 0.72);                        // 一回り小さく
      const img = document.createElement('img');
      img.src = src; img.draggable = false;
      el.appendChild(img);
    } else {
      el.style.fontSize   = itemSize * 0.7 + 'px';
      el.style.lineHeight = '1';
      el.insertAdjacentText('beforeend', EMOJIS[itemIndex++ % EMOJIS.length]);
    }
    el.style.width  = itemSize + 'px';
    el.style.height = itemSize + 'px';

    const sideMargin = 16;
    const x = sideMargin + Math.random() * Math.max(0, W - sideMargin * 2 - itemSize);
    const y = hudH + topMargin + Math.random() * Math.max(0, H - hudH - topMargin - bottomMargin - itemSize);
    el.style.left = x + 'px';
    el.style.top  = y + 'px';

    el.addEventListener('pointerdown', () => triggerBurst(el));
    el.addEventListener('pointerenter', (e) => { if (e.buttons > 0) triggerBurst(el); });

    el.classList.add('spawning');
    el.addEventListener('animationend', () => el.classList.remove('spawning'), { once: true });
    $game.appendChild(el);
  }

  function triggerBurst(el) {
    if (gameOver) return;
    if (el.classList.contains('bursting') || el.classList.contains('pre-burst')) return;
    el.classList.add('pre-burst');
    navigator.vibrate?.(50);
    setTimeout(() => {
      if (!el.isConnected) return;
      createShatter(el);
      const { cx, cy } = createBurst(el);
      const isMilestone = (score + 1) % 10 === 0;
      playBurst(isMilestone);
      shakeScreen();
      el.classList.remove('pre-burst');
      el.classList.add('bursting');
      score++;
      showFloatScore(cx, cy, score);
      document.getElementById('hudScore').textContent  = `💥 ${score}体撃破`;
      document.getElementById('hudRemain').textContent = `残り ${TOTAL_ITEMS - score}体`;
      if (score >= TOTAL_ITEMS) {
        gameWon = true; gameOver = true;
        stopSpawn(); stopTimer();
        setTimeout(() => { el.remove(); endGame(); }, 430);
        return;
      }
      setTimeout(() => el.remove(), 430);
    }, 80);
  }

  function getSpawnInterval() {
    if (score >= 80) return 80;
    if (score >= 60) return 120;
    if (score >= 30) return 155;
    return SPAWN_INTERVAL_MS;
  }

  function spawnLoop() {
    if (gameOver || totalSpawned >= TOTAL_ITEMS) return;
    spawnItem();
    if (totalSpawned < TOTAL_ITEMS) {
      spawnTimerId = setTimeout(spawnLoop, getSpawnInterval());
    }
  }

function runCountdown(cb) {
    const el = document.getElementById('countdown');
    const steps = ['3','2','1','GO!'];
    let i = 0;
    function next() {
      el.innerHTML = '';
      if (i >= steps.length) { cb(); return; }
      const num = document.createElement('div');
      num.className = 'cd-num' + (steps[i] === 'GO!' ? ' cd-go' : '');
      num.textContent = steps[i++];
      el.appendChild(num);
      setTimeout(next, 850);
    }
    next();
  }

  function stopSpawn() {
    clearTimeout(spawnTimerId);
    spawnTimerId = null;
  }

  /* ── ゲーム開始 ── */
  function startGame() {
    $game.querySelectorAll('.tap-item,.particle,.float-score').forEach(e => e.remove());

    score         = 0;
    gameOver      = false;
    gameWon       = false;
    itemIndex     = 0;
    totalSpawned  = 0;
    startTime    = null;
    gameEndTime  = null;
    stopTimer();
    stopSpawn();

    const timerEl = document.getElementById('hudTimer');
    timerEl.textContent = GAME_DURATION.toFixed(2);
    timerEl.classList.remove('orange','red');
    document.getElementById('hudScore').textContent  = '💥 0体撃破';
    document.getElementById('hudRemain').textContent = `残り ${TOTAL_ITEMS}体`;

    showScreen($game);
    runCountdown(() => {
      startTime   = Date.now();
      gameEndTime = startTime + GAME_DURATION * 1000;
      for (let i = 0; i < INITIAL_SPAWN; i++) spawnItem();
      spawnTimerId = setTimeout(spawnLoop, SPAWN_INTERVAL_MS);
      rafId = requestAnimationFrame(tickTimer);
    });
  }

  /* ── ゲーム終了 ── */
  function endGame() {
    const flash = document.getElementById('clearFlash');
    flash.classList.remove('flashing');
    void flash.offsetWidth;
    flash.classList.add('flashing');
    if (gameWon) playClear();
    setTimeout(() => showResult(), gameWon ? 500 : 350);
  }

  /* ── スコア保存・ランキング ── */
  function loadScores() {
    try { return JSON.parse(localStorage.getItem('tg_v3') || '[]'); } catch { return []; }
  }
  function saveScore(won, elapsed, count) {
    const list = loadScores();
    list.push({ won, time: won ? elapsed : null, score: count });
    list.sort((a, b) => {
      if (a.won && !b.won) return -1;
      if (!a.won && b.won) return 1;
      if (a.won && b.won) return a.time - b.time; // タイム短い順
      return b.score - a.score;                   // 撃破数多い順
    });
    localStorage.setItem('tg_v3', JSON.stringify(list.slice(0, 20)));
  }
  function wonRankOf(elapsed) {
    return loadScores().filter(r => r.won && r.time < elapsed).length + 1;
  }
  function renderLb(id) {
    const el  = document.getElementById(id);
    const best = loadScores().slice(0, 1)[0];
    if (!best) {
      el.innerHTML = '<div class="lb-title">🥇 ベスト</div><div class="lb-empty">まだ記録なし</div>';
      return;
    }
    el.innerHTML = '<div class="lb-title">🥇 ベスト</div>' +
      `<div class="lb-row">
         <span class="lb-medal">🥇</span>
         <span class="lb-name">${best.won ? '全滅クリア' : `${best.score}体撃破`}</span>
         <span class="lb-score">${best.won ? best.time.toFixed(1)+'秒' : best.score+'/99'}</span>
       </div>`;
  }

  /* ── リザルト ── */
  function showResult() {
    const elapsed = (Date.now() - startTime) / 1000;
    if (gameWon) {
      const rank = wonRankOf(elapsed);
      saveScore(true, elapsed, score);
      document.getElementById('resLogo').textContent  = '🎉';
      document.getElementById('resTitle').textContent = 'WIN';
      document.getElementById('resTitle').className   = 'result-win';
      document.getElementById('resScore').textContent = elapsed.toFixed(1);
      document.getElementById('resLabel').textContent = '秒でクリア！';
      const labels = { 1:'🥇 最速記録！', 2:'🥈 2位！', 3:'🥉 3位！' };
      document.getElementById('resRank').textContent  = labels[rank] || `第${rank}位`;
    } else {
      saveScore(false, null, score);
      document.getElementById('resLogo').textContent  = '💀';
      document.getElementById('resTitle').textContent = 'LOSE';
      document.getElementById('resTitle').className   = 'result-lose';
      document.getElementById('resScore').textContent = score;
      document.getElementById('resLabel').textContent = `/ ${TOTAL_ITEMS}体撃破`;
      const msg = score < 20 ? 'ファイト！' : score < 50 ? 'もう少し！' : 'あと一歩！';
      document.getElementById('resRank').textContent  = msg;
    }
    renderLb('resLb');
    showScreen($result);
  }

  /* ── ボタン ── */
  document.getElementById('startBtn').addEventListener('click', () => {
    initAudio();
    const audio = new Audio('start.mp3');
    audio.play().catch(() => {});
    setTimeout(() => startGame(), 1000);
  });
  document.getElementById('retryBtn').addEventListener('click', () => { initAudio(); startGame(); });
  // ゲーム画面タップのたびにAudioContext再開（iOS対策）
  document.getElementById('gameScreen').addEventListener('pointerdown', () => initAudio(), { capture: true });
  document.getElementById('backBtn').addEventListener('click', () => {
    renderLb('topLb');
    showScreen($name);
  });

  /* ── 起動時 ── */
  (async () => {
    renderLb('topLb');
    heroImgSrcs = (await Promise.all(
      HERO_SRCS.map(src => new Promise(resolve => {
        const img = new Image();
        img.onload  = () => resolve(src);
        img.onerror = () => resolve(null);
        img.src = src;
      }))
    )).filter(Boolean);
  })();
</script>
</body>
</html>
