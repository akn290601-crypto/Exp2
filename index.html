<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>タップゲーム</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0c29;
      min-height: 100dvh;
      overflow: hidden;
      color: #fff;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px env(safe-area-inset-bottom);
      overflow-y: auto;
    }
    .screen.hidden { display: none; }

    /* ── Name screen ── */
    .logo { font-size: 3rem; margin-bottom: 8px; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
    .sub { color: #aaa; font-size: 0.9rem; margin-bottom: 28px; text-align: center; line-height: 1.6; }

    input[type="text"] {
      width: 100%;
      max-width: 280px;
      padding: 14px 18px;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    input[type="text"]::placeholder { color: #555; }
    input[type="text"]:focus { border-color: #f7971e; }

    /* hero image preview on name screen */
    .hero-preview-wrap {
      width: 100%;
      max-width: 280px;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hero-preview-wrap img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .hero-preview-text { font-size: 0.85rem; color: #ccc; line-height: 1.5; }
    .hero-preview-text strong { color: #f7971e; display: block; }

    .btn {
      padding: 14px 36px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary   { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a1a; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 2px solid rgba(255,255,255,0.2); }

    /* ── Leaderboard ── */
    .lb-wrap { width: 100%; max-width: 280px; margin-top: 24px; }
    .lb-title { text-align: center; font-size: 0.8rem; color: #ffd200; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
    .lb-empty { text-align: center; color: #555; font-size: 0.85rem; }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
    }
    .lb-medal { font-size: 1.2rem; width: 26px; text-align: center; flex-shrink: 0; }
    .lb-name  { flex: 1; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-time  { color: #ffd200; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; }

    /* ── Game screen ── */
    #gameScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #1b1b3a 0%, #0f0c29 100%);
      overflow: hidden;
      touch-action: none;
    }
    .game-hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 20px;
      padding-top: max(12px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }
    .hud-timer  { font-size: 1.6rem; font-weight: 800; color: #ffd200; font-variant-numeric: tabular-nums; }
    .hud-remain { font-size: 0.9rem; color: #aaa; }

    /* ── Tap items ── */
    .tap-item {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform-origin: center;
      -webkit-tap-highlight-color: transparent;
      transition: width 0.12s ease, height 0.12s ease, font-size 0.12s ease;
      overflow: hidden;
    }
    .tap-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      pointer-events: none;
      display: block;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    @keyframes vanish {
      0%   { transform: scale(1);   opacity: 1; }
      60%  { transform: scale(1.3); opacity: 0.5; }
      100% { transform: scale(0);   opacity: 0; }
    }
    .tap-item.popping  { animation: pop    0.18s ease; }
    .tap-item.vanishing{ animation: vanish 0.28s ease forwards; pointer-events: none; }

    /* ── Result screen ── */
    .result-time { font-size: 3.5rem; font-weight: 900; color: #ffd200; margin: 12px 0 4px; }
    .result-rank { font-size: 1rem; color: #aaa; margin-bottom: 20px; }
    .btn-row { display: flex; gap: 12px; margin-top: 20px; }
  </style>
</head>
<body>

<!-- ① 名前入力 -->
<div class="screen" id="nameScreen">
  <div class="logo">⚡</div>
  <h1>タップゲーム</h1>
  <p class="sub">画像を3回タップして消そう！<br>速さを競え！</p>

  <input type="text" id="nameInput" placeholder="プレイヤー名を入力"
    maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

  <!-- hero.jpg が存在するときだけ表示 -->
  <div class="hero-preview-wrap hidden" id="heroPreviewWrap">
    <img id="heroThumb" src="" alt="hero">
    <div class="hero-preview-text">
      <strong>画像読み込み済み</strong>
      この画像がタップ対象になります
    </div>
  </div>

  <button class="btn btn-primary" id="startBtn">ゲームスタート</button>
  <div class="lb-wrap" id="topLb"></div>
</div>

<!-- ② ゲーム -->
<div class="screen hidden" id="gameScreen">
  <div class="game-hud">
    <div class="hud-timer"  id="hudTimer">0.00</div>
    <div class="hud-remain" id="hudRemain">残り 15個</div>
  </div>
</div>

<!-- ③ リザルト -->
<div class="screen hidden" id="resultScreen">
  <div class="logo">🎉</div>
  <h1>クリア！</h1>
  <div class="result-time" id="resTime"></div>
  <div class="result-rank" id="resRank"></div>
  <div class="lb-wrap" id="resLb"></div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="backBtn">トップへ</button>
    <button class="btn btn-primary"   id="retryBtn">もう一度</button>
  </div>
</div>

<script>
  'use strict';

  const EMOJIS   = ['🍎','🍊','🍋','🍇','🍓','🍉','🍑','🌟','🎯','🦋','🌸','🎪','🍄','🎨','🌈'];
  const TOTAL    = 8;
  const TAPS_MAX = 3;
  const SIZES    = [120, 80, 45];
  const MEDALS   = ['🥇','🥈','🥉'];
  const HERO_SRC = 'IMG_3716.png';   // リポジトリに置く画像ファイル名

  let playerName   = '';
  let heroImgSrc   = null;   // hero.jpg が読み込めたらここに格納
  let startTime    = null;
  let rafId        = null;
  let remaining    = 0;
  let active       = false;

  const $name   = document.getElementById('nameScreen');
  const $game   = document.getElementById('gameScreen');
  const $result = document.getElementById('resultScreen');

  function showScreen(el) {
    [$name, $game, $result].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  /* ── hero.jpg を自動ロード ── */
  function tryLoadHero() {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(img.src);
      img.onerror = () => resolve(null);
      img.src = HERO_SRC;
    });
  }

  /* ── localStorage scores ── */
  function loadScores() {
    try { return JSON.parse(localStorage.getItem('tg_v1') || '[]'); } catch { return []; }
  }
  function saveScore(name, time) {
    const list = loadScores();
    list.push({ name, time });
    list.sort((a, b) => a.time - b.time);
    localStorage.setItem('tg_v1', JSON.stringify(list.slice(0, 20)));
  }
  function rankOf(time) {
    return loadScores().filter(s => s.time < time).length + 1;
  }
  function renderLb(id) {
    const el  = document.getElementById(id);
    const top = loadScores().slice(0, 3);
    if (!top.length) {
      el.innerHTML = '<div class="lb-title">🏆 ベスト 3</div><div class="lb-empty">まだ記録なし</div>';
      return;
    }
    el.innerHTML = '<div class="lb-title">🏆 ベスト 3</div>' +
      top.map((s, i) =>
        `<div class="lb-row">
           <span class="lb-medal">${MEDALS[i]}</span>
           <span class="lb-name">${esc(s.name)}</span>
           <span class="lb-time">${s.time.toFixed(2)}s</span>
         </div>`
      ).join('');
  }
  function esc(s) {
    return s.replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ── Name screen ── */
  document.getElementById('startBtn').addEventListener('click', () => {
    const v = document.getElementById('nameInput').value.trim();
    if (!v) { document.getElementById('nameInput').focus(); return; }
    playerName = v;
    startGame();
  });
  document.getElementById('nameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('startBtn').click();
  });

  /* ── Timer ── */
  function tickTimer() {
    if (startTime) {
      document.getElementById('hudTimer').textContent =
        ((Date.now() - startTime) / 1000).toFixed(2);
    }
    rafId = requestAnimationFrame(tickTimer);
  }
  function stopTimer() { cancelAnimationFrame(rafId); rafId = null; }

  /* ── Game ── */
  function startGame() {
    $game.querySelectorAll('.tap-item').forEach(e => e.remove());

    remaining = TOTAL;
    startTime = null;
    active    = false;
    stopTimer();

    document.getElementById('hudTimer').textContent  = '0.00';
    document.getElementById('hudRemain').textContent = `残り ${TOTAL}個`;

    showScreen($game);

    const hudH   = $game.querySelector('.game-hud').offsetHeight || 56;
    const margin = 36;
    const W      = window.innerWidth;
    const H      = window.innerHeight;
    const sz0    = SIZES[0];

    for (let i = 0; i < TOTAL; i++) {
      const el = document.createElement('div');
      el.className = 'tap-item';
      setSize(el, sz0);

      if (heroImgSrc) {
        const img = document.createElement('img');
        img.src       = heroImgSrc;
        img.draggable = false;
        el.appendChild(img);
      } else {
        el.textContent    = EMOJIS[i % EMOJIS.length];
        el.style.fontSize = sz0 + 'px';
        el.style.lineHeight = '1';
      }

      const x = margin + Math.random() * Math.max(0, W - margin * 2 - sz0);
      const y = hudH + margin + Math.random() * Math.max(0, H - hudH - margin * 2 - sz0);
      el.style.left = x + 'px';
      el.style.top  = y + 'px';

      let taps = 0;

      el.addEventListener('click', () => {
        if (el.classList.contains('vanishing')) return;

        if (!active) {
          active    = true;
          startTime = Date.now();
          rafId     = requestAnimationFrame(tickTimer);
        }

        taps++;

        if (taps >= TAPS_MAX) {
          el.classList.add('vanishing');
          setTimeout(() => el.remove(), 290);
          remaining--;
          document.getElementById('hudRemain').textContent = `残り ${remaining}個`;
          if (remaining <= 0) {
            stopTimer();
            const elapsed = (Date.now() - startTime) / 1000;
            setTimeout(() => showResult(elapsed), 320);
          }
        } else {
          const sz = SIZES[taps];
          setSize(el, sz);
          if (!heroImgSrc) el.style.fontSize = sz + 'px';
          el.classList.remove('popping');
          void el.offsetWidth;
          el.classList.add('popping');
          el.addEventListener('animationend', () => el.classList.remove('popping'), { once: true });
        }
      });

      $game.appendChild(el);
    }
  }

  function setSize(el, px) {
    el.style.width  = px + 'px';
    el.style.height = px + 'px';
  }

  /* ── Result ── */
  function showResult(elapsed) {
    const rank = rankOf(elapsed);
    saveScore(playerName, elapsed);

    document.getElementById('resTime').textContent = elapsed.toFixed(2) + 's';
    const labels = { 1:'🥇 1位！最速！', 2:'🥈 2位！', 3:'🥉 3位！' };
    document.getElementById('resRank').textContent = labels[rank] || 'タイム記録！';

    renderLb('resLb');
    showScreen($result);
  }

  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('backBtn').addEventListener('click', () => {
    renderLb('topLb');
    showScreen($name);
  });

  /* ── 起動時：hero.jpg を試みる ── */
  (async () => {
    renderLb('topLb');
    heroImgSrc = await tryLoadHero();
    if (heroImgSrc) {
      const wrap  = document.getElementById('heroPreviewWrap');
      const thumb = document.getElementById('heroThumb');
      thumb.src = heroImgSrc;
      wrap.classList.remove('hidden');
    }
  })();
</script>
</body>
</html>
