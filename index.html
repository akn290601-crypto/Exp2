<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>トキワ帝国の野望</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0c29;
      min-height: 100dvh;
      overflow: hidden;
      color: #fff;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px env(safe-area-inset-bottom);
      overflow-y: auto;
    }
    .screen.hidden { display: none; }

    #nameScreen {
      background: radial-gradient(ellipse at center, #6b0f0f 0%, #3a0505 60%, #1e0202 100%);
      padding-top: max(60px, env(safe-area-inset-top) + 40px);
      justify-content: flex-start;
    }

    .logo { font-size: 3rem; margin-bottom: 8px; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
    .title-logo {
      width: min(320px, 88vw);
      height: auto;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 24px rgba(0,0,0,0.7));
    }
    .sub { color: #aaa; font-size: 0.9rem; margin-bottom: 28px; text-align: center; line-height: 1.6; }

    .btn {
      padding: 14px 36px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary   { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a1a; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 2px solid rgba(255,255,255,0.2); }

    /* ── Leaderboard ── */
    .lb-wrap { width: 100%; max-width: 280px; margin-top: 24px; }
    .lb-title { text-align: center; font-size: 0.8rem; color: #ffd200; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
    .lb-empty { text-align: center; color: #555; font-size: 0.85rem; }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
    }
    .lb-medal { font-size: 1.2rem; width: 26px; text-align: center; flex-shrink: 0; }
    .lb-name  { flex: 1; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { color: #ffd200; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; }

    /* ── Game screen ── */
    #gameScreen {
      position: fixed;
      inset: 0;
      background: url('IMG_3753.png') center center / cover no-repeat, #000;
      overflow: hidden;
      touch-action: none;
    }

    @keyframes shake {
      0%,100% { transform: translate(0,0) rotate(0deg); }
      20%     { transform: translate(-6px, 3px) rotate(-0.5deg); }
      40%     { transform: translate( 6px,-3px) rotate( 0.5deg); }
      60%     { transform: translate(-4px, 2px) rotate(-0.3deg); }
      80%     { transform: translate( 4px,-2px) rotate( 0.3deg); }
    }
    #gameScreen.shaking { animation: shake 0.3s ease; }

    /* ヒットスパーク */
    .hit-spark {
      position: absolute;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #ffd200 50%, transparent 75%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 50;
      animation: hit-spark 0.18s ease-out forwards;
    }
    @keyframes hit-spark {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(3.0); opacity: 0; }
    }
    /* コンボ表示 */
    .combo-text {
      position: absolute;
      font-size: 1.6rem;
      font-weight: 900;
      color: #ff6600;
      text-shadow: 0 0 8px rgba(255,100,0,0.8), 0 2px 4px rgba(0,0,0,0.6);
      pointer-events: none;
      z-index: 55;
      animation: combo-pop 0.7s ease-out forwards;
    }
    @keyframes combo-pop {
      0%   { transform: translate(-50%,-50%) scale(0.5); opacity: 1; }
      40%  { transform: translate(-50%,-70%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%,-120%) scale(0.9); opacity: 0; }
    }
    /* 撃破時の画面縁フラッシュ */
    #hitRim {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 48;
      border-radius: 4px;
      opacity: 0;
      box-shadow: inset 0 0 40px rgba(255,220,0,0.7);
      transition: opacity 0.04s;
    }
    #hitRim.active { opacity: 1; }

    #clearFlash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }
    @keyframes flash {
      0%   { opacity: 0; }
      30%  { opacity: 0.75; }
      100% { opacity: 0; }
    }
    #clearFlash.flashing { animation: flash 0.4s ease-out forwards; }

    @keyframes conquest-in {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
      40%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
      65%  { transform: translate(-50%,-50%) scale(0.97); }
      100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    }
    @keyframes conquest-out {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }
    #conquestMsg {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
      pointer-events: none;
      z-index: 60;
      background: rgba(0,0,0,0.72);
      border: 3px solid #ff3300;
      border-radius: 20px;
      padding: 28px 36px;
      width: min(340px, 86vw);
    }
    #conquestMsg.show { display: block; animation: conquest-in 0.6s ease-out forwards; }
    #conquestMsg.hide { animation: conquest-out 0.5s ease-in forwards; }
    #conquestMsg .cq-title {
      font-size: 1.1rem; color: #ff5500; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.05em;
    }
    #conquestMsg .cq-main {
      font-size: 2rem; font-weight: 900; color: #fff;
      text-shadow: 0 0 20px #ff3300, 0 0 40px #ff0000;
      line-height: 1.4;
    }

    #overwhelmMsg {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
      pointer-events: none;
      z-index: 60;
      background: rgba(0,0,0,0.72);
      border: 3px solid #ff3300;
      border-radius: 20px;
      padding: 28px 36px;
      width: min(340px, 86vw);
    }
    #overwhelmMsg.show { display: block; animation: conquest-in 0.6s ease-out forwards; }
    #overwhelmMsg.hide { animation: conquest-out 0.5s ease-in forwards; }
    #overwhelmMsg .ow-title {
      font-size: 1.1rem; color: #ffd200; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.05em;
    }
    #overwhelmMsg .ow-main {
      font-size: 2.4rem; font-weight: 900; color: #fff;
      text-shadow: 0 0 20px #ffd200, 0 0 40px #ff8800;
      line-height: 1.4;
    }

    #reconcileMsg {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
      pointer-events: none;
      z-index: 60;
      background: rgba(0,0,0,0.72);
      border: 3px solid #ff3300;
      border-radius: 20px;
      padding: 28px 36px;
      width: min(340px, 86vw);
    }
    #reconcileMsg.show { display: block; animation: conquest-in 0.6s ease-out forwards; }
    #reconcileMsg.hide { animation: conquest-out 0.5s ease-in forwards; }
    #reconcileMsg .rc-title {
      font-size: 1.1rem; color: #00ccff; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.05em;
    }
    #reconcileMsg .rc-main {
      font-size: 2.8rem; font-weight: 900; color: #fff;
      text-shadow: 0 0 20px #00ccff, 0 0 40px #0088ff;
      line-height: 1.4;
    }

    .result-win-win {
      color: #00eeff;
      text-shadow: 0 0 20px #00ccff, 0 0 40px #0088ff;
    }

    #dangerOverlay {
      position: absolute;
      inset: 0;
      background: rgba(220, 0, 0, 0.28);
      pointer-events: none;
      z-index: 8;
      opacity: 0;
    }
    @keyframes danger-flash {
      0%,100% { opacity: 0; }
      50%     { opacity: 1; }
    }
    #dangerOverlay.active { animation: danger-flash 0.45s ease-in-out infinite; }

    /* ── 覚醒Lv1 ── */
    #gameScreen.fever {
      box-shadow: inset 0 0 0 4px #ffd200, inset 0 0 50px rgba(255,210,0,0.35);
    }
    #gameScreen.fever .tap-item:not(.pre-burst):not(.bursting):not(.spawning) {
      box-shadow: 0 0 18px 8px rgba(255,210,0,0.65);
    }
    #gameScreen.fever .tap-item:not(.pre-burst):not(.bursting):not(.spawning)::after {
      content: '';
      position: absolute;
      inset: -24px;
      z-index: 2;
    }
    /* ── 覚醒Lv2 ── */
    #gameScreen.fever-lv2 {
      box-shadow: inset 0 0 0 5px #ff6600, inset 0 0 60px rgba(255,80,0,0.45);
    }
    #gameScreen.fever-lv2 .tap-item:not(.pre-burst):not(.bursting):not(.spawning) {
      box-shadow: 0 0 28px 14px rgba(255,80,0,0.8);
    }
    #gameScreen.fever-lv2 .tap-item:not(.pre-burst):not(.bursting):not(.spawning)::after {
      inset: -46px;
    }
    .fever-label-lv2 {
      color: #ff5500 !important;
      text-shadow: 0 0 20px #ff2200, 0 0 50px #ff6600 !important;
    }
    @keyframes fever-pop {
      0%   { transform: translate(-50%,-50%) scale(2.8); opacity: 0; }
      18%  { transform: translate(-50%,-50%) scale(1);   opacity: 1; }
      75%  { transform: translate(-50%,-50%) scale(1);   opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(0.8); opacity: 0; }
    }
    .fever-label {
      position: absolute;
      top: 44%;
      left: 50%;
      font-size: 3.8rem;
      font-weight: 900;
      color: #ffd200;
      text-shadow: 0 0 20px #ff8800, 0 0 50px #ffd200;
      pointer-events: none;
      z-index: 35;
      white-space: nowrap;
      animation: fever-pop 1.3s ease-out forwards;
    }

    .game-hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 8px 14px;
      padding-top: max(8px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }
    /* カウントダウン */
    .hud-timer {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffd200;
      font-variant-numeric: tabular-nums;
      transition: color 0.4s;
      flex-shrink: 0;
    }
    .hud-timer.orange { color: #ff8c00; }
    .hud-timer.red    { color: #ff2200; animation: timer-blink 0.35s ease-in-out infinite alternate; }
    @keyframes timer-blink { from { opacity:1; } to { opacity:0.4; } }

    /* スコア表示 */
    .hud-right  { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0; }
    .hud-score  { font-size: 0.75rem; font-weight: 700; color: #ffd200; white-space: nowrap; }
    .hud-remain { font-size: 0.95rem; font-weight: 900; color: #ff6633; white-space: nowrap; }

    /* カウントダウン */
    #countdown {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      pointer-events: none;
    }
    @keyframes cd-pop {
      0%   { transform: scale(2.5); opacity: 0; }
      25%  { transform: scale(1);   opacity: 1; }
      75%  { transform: scale(1);   opacity: 1; }
      100% { transform: scale(0.4); opacity: 0; }
    }
    .cd-num {
      position: absolute;
      font-size: 7rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px #ffd200, 0 0 60px #ffd200;
      animation: cd-pop 0.85s ease-out forwards;
    }
    .cd-go {
      font-size: 5rem;
      color: #ff4400;
      text-shadow: 0 0 30px #ff8800, 0 0 60px #ff4400;
    }

    /* WIN / LOSE */
    .result-win  { color: #ffd200; text-shadow: 0 0 20px #ffd200; }
    .result-lose { color: #ff3300; text-shadow: 0 0 20px #ff3300; }



    /* スポーン演出 */
    @keyframes spawn-in {
      0%   { transform: scale(0.1) rotate(-20deg); opacity: 0; }
      65%  { transform: scale(1.18) rotate(4deg);  opacity: 1; }
      100% { transform: scale(1)   rotate(0deg);   opacity: 1; }
    }
    .tap-item.spawning { animation: spawn-in 0.22s cubic-bezier(0.34,1.56,0.64,1) forwards; }

/* ── Tap items ── */
    .tap-item {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform-origin: center;
      -webkit-tap-highlight-color: transparent;
      border-radius: 12px;
    }
    .tap-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      pointer-events: none;
      display: block;
    }
    .tap-overlay {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 1;
    }
    .tap-item.stage-1 .tap-overlay {
      background: rgba(255,210,0,0.5);
      opacity: 1;
      box-shadow: 0 0 20px 6px rgba(255,210,0,0.7);
    }
    .tap-item.stage-2 .tap-overlay {
      background: rgba(255,40,0,0.55);
      opacity: 1;
      box-shadow: 0 0 28px 8px rgba(255,40,0,0.8);
      animation: danger-pulse 0.22s ease-in-out infinite alternate;
    }
    @keyframes danger-pulse { from { opacity:.85; } to { opacity:1; } }

    @keyframes pop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .tap-item.popping { animation: pop 0.16s ease; }

    .tap-item.pre-burst {
      transform: scale(0.55) !important;
      transition: transform 0.14s ease-in !important;
      pointer-events: none;
    }
    @keyframes burst {
      0%   { transform: scale(0.55) rotate(0deg);  opacity: 1; }
      30%  { transform: scale(1.7)  rotate(8deg);  opacity: 0.9; }
      65%  { transform: scale(2.2)  rotate(-6deg); opacity: 0.4; }
      100% { transform: scale(0.3)  rotate(12deg); opacity: 0; }
    }
    .tap-item.bursting {
      animation: burst 0.42s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes particle-fly {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity: 0; }
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      animation: particle-fly 0.55s ease-out forwards;
    }

    @keyframes shatter {
      0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0.2); opacity: 0; }
    }
    .shard {
      position: absolute;
      pointer-events: none;
      z-index: 16;
      overflow: hidden;
      border-radius: 3px;
      animation: shatter 0.52s ease-out forwards;
    }

    @keyframes float-up {
      0%   { transform: translateY(0)     scale(1);   opacity: 1; }
      60%  { transform: translateY(-40px) scale(1.1); opacity: 1; }
      100% { transform: translateY(-70px) scale(0.8); opacity: 0; }
    }
    .float-score {
      position: absolute;
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffd200;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      pointer-events: none;
      z-index: 20;
      animation: float-up 0.7s ease-out forwards;
    }
    .float-score.milestone {
      font-size: 3.6rem;
      color: #ff4400;
      text-shadow: 0 0 20px #ff8800, 0 0 40px #ff4400, 0 3px 8px rgba(0,0,0,0.8);
      animation: float-up 1s ease-out forwards;
    }

    /* ── Player ship ── */
    #playerShip {
      position: absolute;
      bottom: 30px;
      left: calc(50% - 56px);
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      filter: drop-shadow(0 0 12px rgba(0,200,255,0.8));
      pointer-events: none;
      z-index: 12;
    }
    /* ── Bullets ── */
    .bullet {
      position: absolute;
      width: 6px;
      height: 20px;
      border-radius: 3px;
      background: linear-gradient(to top, #00ffee, #ffffff);
      box-shadow: 0 0 8px 2px rgba(0,255,238,0.8);
      pointer-events: none;
      z-index: 11;
    }

    /* ── Power-up items ── */
    .power-item {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      pointer-events: none;
      z-index: 9;
      animation: power-spin 1.2s linear infinite;
    }
    @keyframes power-spin {
      0%   { transform: rotate(0deg)   scale(1);   }
      50%  { transform: rotate(180deg) scale(1.25); }
      100% { transform: rotate(360deg) scale(1);   }
    }
    /* ── Stage label ── */
    @keyframes stage-pop {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
      20%  { opacity: 1; transform: translate(-50%,-50%) scale(1.12); }
      75%  { opacity: 1; transform: translate(-50%,-50%) scale(1);   }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(0.9); }
    }
    .stage-label {
      position: absolute;
      top: 44%; left: 50%;
      font-size: 3.6rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px #00ccff, 0 0 50px #0088ff;
      pointer-events: none;
      z-index: 36;
      white-space: nowrap;
      animation: stage-pop 1.6s ease-out forwards;
    }
    /* ── Power-up label ── */
    @keyframes power-pulse { from { opacity: 1; } to { opacity: 0.5; } }
    #powerUpLabel {
      position: absolute;
      bottom: 108px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      font-weight: 700;
      color: #00ffee;
      text-shadow: 0 0 10px #00ffee, 0 0 20px #00aaaa;
      pointer-events: none;
      z-index: 15;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #powerUpLabel.active { opacity: 1; animation: power-pulse 0.6s ease-in-out infinite alternate; }

    /* 結果 */
    .result-score { font-size: 4rem; font-weight: 900; color: #ffd200; margin: 8px 0 2px; }
    .result-label { font-size: 1.1rem; color: #aaa; margin-bottom: 4px; }
    .result-rank  { font-size: 1rem;   color: #aaa; margin-bottom: 20px; }
    .btn-row { display: flex; gap: 12px; margin-top: 20px; }

    /* ── Story screen ── */
    #storyScreen {
      background: #000;
      overflow: hidden;
    }
    #storyScreen.hidden { display: none; } /* IDセレクター競合を明示解決 */
    /* 冒頭フェード行 */
    #storyIntro {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      animation: intro-fade 3s ease-out forwards;
      pointer-events: none;
    }
    @keyframes intro-fade {
      0%,40% { opacity: 1; }
      90%,100% { opacity: 0; }
    }
    #storyIntro p {
      color: #3366cc;
      font-size: 1.1rem;
      font-style: italic;
      text-align: center;
      letter-spacing: 0.08em;
    }
    /* クロール本体 */
    #crawlWrap {
      position: absolute;
      inset: 0;
      perspective: 260px;
      perspective-origin: 50% 55%;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 32%, black 68%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 32%, black 68%, transparent 100%);
    }
    #crawlText {
      position: absolute;
      width: 72%;
      left: 14%;
      color: #ffd200;
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 2.4;
      text-align: center;
      text-shadow: 0 0 8px rgba(255,210,0,0.4);
      transform-origin: 50% 100%;
      animation: crawl-move 13s linear 3s forwards;
      transform: rotateX(28deg) translateY(110vh);
    }
    @keyframes crawl-move {
      0%   { transform: rotateX(28deg) translateY(110vh); opacity: 1; }
      30%  { opacity: 1; }
      55%  { opacity: 0; }
      100% { transform: rotateX(28deg) translateY(-300%); opacity: 0; }
    }
    #storyLogo {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 3.5s ease-in;
      width: 95vw;
    }
    #storyLogo.visible { opacity: 1; }
    #storyLogo .logo-title {
      font-size: 2.6rem;
      font-weight: 900;

<script>
  'use strict';

  const EMOJIS            = ['🍎','🍊','🍋','🍇','🍓','🍉','🍑','🌟','🎯','🦋','🌸','🎪','🍄','🎨','🌈'];
  const TAPS_MAX          = 1;
  const SIZE              = 90;
  const MEDALS            = ['🥇','🥈','🥉'];
  const HERO_SRCS         = ['IMG_3716.png','IMG_3754.png','IMG_3755.png','IMG_3756.png','IMG_3757.png'];
  const SPAWN_INTERVAL_MS = 600;
  const INITIAL_SPAWN     = 3;
  const STAGE_CONFIGS = [
    { num: 1, label: 'STAGE 1', quota: 15, spawnLimit: 15,
      srcs: ['IMG_3755.png','IMG_3756.png','IMG_3757.png'], vyMin: 1.2, vyMax: 2.0 },
    { num: 2, label: 'STAGE 2', quota: 20, spawnLimit: 20,
      srcs: ['IMG_3755.png','IMG_3756.png','IMG_3757.png','IMG_3716.png','IMG_3751.png'], vyMin: 1.8, vyMax: 2.8 },
    { num: 3, label: 'STAGE 3', quota: 25, spawnLimit: 25,
      srcs: ['IMG_3755.png','IMG_3756.png','IMG_3757.png','IMG_3716.png','IMG_3751.png','IMG_3753.png'], vyMin: 2.5, vyMax: 3.8 },
  ];

  let heroImgSrcs    = [];
  let score          = 0;
  let rafId          = null;
  let gameOver       = false;
  let gameWon        = false;
  let itemIndex      = 0;
  let totalSpawned   = 0;
  let spawnTimerId   = null;
  let startTime      = null;
  let feverMode        = false;
  let feverTimer       = null;
  let recentKills      = [];
  let gameEndType          = '';
  let speedBoostCount      = 0;
  let speedBoostNextThresh = 5;
  let recentKillsSpeed     = [];
  let playerX   = 0;
  let bullets   = [];
  let enemies   = [];
  let fireTimer = null;
  let currentStageNum = 1;
  let totalScore      = 0;
  let totalElapsed    = 0;
  let powerUpActive = false;
  let powerUpType   = null;
  let powerUpTimer  = null;
  let powerItems    = [];
  let powerSpawnTimer = null;

  const $name       = document.getElementById('nameScreen');
  const $game       = document.getElementById('gameScreen');
  const $result     = document.getElementById('resultScreen');
  const $story      = document.getElementById('storyScreen');
  const $stageResult= document.getElementById('stageResultScreen');
  const $video      = document.getElementById('videoScreen');

  function showScreen(el) {
    [$name, $game, $result, $story, $stageResult, $video].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  function playIntroVideo(onDone) {
    const vid = document.getElementById('introVideo');
    showScreen($video);
    vid.currentTime = 0;
    vid.play().catch(() => onDone());
    vid.onended = () => onDone();
    vid.onerror = () => onDone();
    $video.onclick = () => { vid.pause(); vid.onended = null; onDone(); };
  }

  /* ── BGM ── */
  const bgmAudio = document.getElementById('bgm');
  bgmAudio.volume = 0.5;
  let bgmFadeTimer = null;

  function unlockBGM() {
    bgmAudio.muted = true;
    bgmAudio.play().then(() => {
      bgmAudio.pause();
      bgmAudio.muted = false;
      bgmAudio.currentTime = 0;
    }).catch(() => { bgmAudio.muted = false; });
  }
  function startBGM() {
    clearInterval(bgmFadeTimer);
    bgmAudio.volume = 0.5;
    bgmAudio.currentTime = 0;
    bgmAudio.play().catch(() => {});
  }
  function stopBGM() {
    clearInterval(bgmFadeTimer);
    bgmAudio.pause();
    bgmAudio.currentTime = 0;
    bgmAudio.volume = 0.5;
  }
  function fadeBGM() {
    clearInterval(bgmFadeTimer);
    bgmFadeTimer = setInterval(() => {
      bgmAudio.volume = Math.max(0, bgmAudio.volume - 0.04);
      if (bgmAudio.volume <= 0) { clearInterval(bgmFadeTimer); bgmAudio.pause(); bgmAudio.volume = 0.5; bgmAudio.currentTime = 0; }
    }, 40);
  }

  /* ── Audio ── */
  let audioCtx = null;
  function initAudio() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      audioCtx.resume().then(() => {
        const buf = audioCtx.createBuffer(1, 1, 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
      });
    } catch (_) {}
  }
  function getCtx() {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playHit(stage) {
    try {
      const ctx = getCtx(); if (!ctx) return;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(stage === 1 ? 180 : 260, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(stage === 1 ? 120 : 180, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
    } catch (_) {}
  }

  function playBurst(milestone) {
    try {
      const ctx = getCtx(); if (!ctx) return;
      const t = ctx.currentTime;

      // ノイズ（打撃感）
      const bufLen = ctx.sampleRate * 0.25;
      const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 1.5);
      const noise = ctx.createBufferSource();
      const nFilter = ctx.createBiquadFilter();
      const nGain = ctx.createGain();
      nFilter.type = 'bandpass'; nFilter.frequency.value = milestone ? 800 : 500; nFilter.Q.value = 0.8;
      noise.buffer = buf;
      noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(ctx.destination);
      nGain.gain.setValueAtTime(milestone ? 1.0 : 0.7, t);
      nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      noise.start(t);

      // ピッチダウン（ドスン感）
      const osc = ctx.createOscillator();
      const oGain = ctx.createGain();
      osc.connect(oGain); oGain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(milestone ? 280 : 180, t);
      osc.frequency.exponentialRampToValueAtTime(35, t + 0.2);
      oGain.gain.setValueAtTime(milestone ? 0.9 : 0.65, t);
      oGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t); osc.stop(t + 0.25);

      // マイルストーン追加音（高音アクセント）
      if (milestone) {
        const osc2 = ctx.createOscillator();
        const g2 = ctx.createGain();
        osc2.connect(g2); g2.connect(ctx.destination);
        osc2.type = 'square'; osc2.frequency.value = 880;
        g2.gain.setValueAtTime(0.3, t + 0.05);
        g2.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc2.start(t + 0.05); osc2.stop(t + 0.2);
      }
    } catch (_) {}
  }

  function playCountdownBeep(isGo) {
    try {
      const ctx = getCtx(); if (!ctx) return;
      const fire = () => {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (isGo) {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, t);
          osc.frequency.exponentialRampToValueAtTime(1400, t + 0.22);
          gain.gain.setValueAtTime(0.6, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.start(t); osc.stop(t + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(660, t);
          gain.gain.setValueAtTime(0.55, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.start(t); osc.stop(t + 0.22);
        }
      };
      ctx.state === 'suspended' ? ctx.resume().then(fire) : fire();
    } catch (_) {}
  }

  function playWarnBeep() {
    try {
      const ctx = getCtx(); if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(660, t);
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      osc.start(t); osc.stop(t + 0.09);
    } catch (_) {}
  }

  function playClear() {
    try {
      const ctx = getCtx(); if (!ctx) return;
      [523, 659, 784, 1047].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination); osc.type = 'triangle';
        const t = ctx.currentTime + i * 0.1;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.start(t); osc.stop(t + 0.25);
      });
    } catch (_) {}
  }

  /* ── エフェクト ── */
  function shakeScreen() {
    $game.classList.remove('shaking');
    void $game.offsetWidth;
    $game.classList.add('shaking');
    $game.addEventListener('animationend', () => $game.classList.remove('shaking'), { once: true });
  }

  function showFloatScore(cx, cy, count) {
    const isMilestone = count % 10 === 0;
    const el = document.createElement('div');
    el.className = 'float-score' + (isMilestone ? ' milestone' : '');
    el.textContent = count;
    const offset = isMilestone ? 40 : 24;
    el.style.left = (cx - offset) + 'px';
    el.style.top  = (cy - 30) + 'px';
    $game.appendChild(el);
    setTimeout(() => el.remove(), isMilestone ? 1050 : 750);
  }

  /* ── 爽快感エフェクト ── */
  let hitRimTimer = null;
  function flashHitRim() {
    const rim = document.getElementById('hitRim');
    if (!rim) return;
    rim.classList.add('active');
    clearTimeout(hitRimTimer);
    hitRimTimer = setTimeout(() => rim.classList.remove('active'), 80);
  }

  function createHitSpark(x, y) {
    const el = document.createElement('div');
    el.className = 'hit-spark';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    $game.appendChild(el);
    setTimeout(() => el.remove(), 220);
  }

  let comboCount = 0;
  let comboTimer = null;
  function showCombo(cx, cy) {
    comboCount++;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { comboCount = 0; }, 1200);
    if (comboCount < 3) return;
    const el = document.createElement('div');
    el.className = 'combo-text';
    el.textContent = comboCount + ' COMBO!';
    el.style.left = cx + 'px';
    el.style.top  = cy + 'px';
    $game.appendChild(el);
    setTimeout(() => el.remove(), 750);
  }

  function playHitLight() {
    try {
      const ctx = getCtx(); if (!ctx) return;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.06);
      g.gain.setValueAtTime(0.18, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.07);
    } catch (_) {}
  }

  function createBurst(el) {
    const rect = el.getBoundingClientRect();
    const gr   = $game.getBoundingClientRect();
    const cx   = rect.left - gr.left + rect.width  / 2;
    const cy   = rect.top  - gr.top  + rect.height / 2;
    const colors = ['#ff4400','#ff8800','#ffdd00','#ff2200','#ffaa00','#ffffff','#ff66aa','#ffcc00','#ff0066'];
    for (let i = 0; i < 22; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (i / 22) * Math.PI * 2;
      const dist  = 65 + Math.random() * 90;
      const sz    = 8 + Math.random() * 12;
      p.style.cssText =
        `width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};` +
        `left:${cx-sz/2}px;top:${cy-sz/2}px;` +
        `--dx:${(Math.cos(angle)*dist).toFixed(1)}px;--dy:${(Math.sin(angle)*dist).toFixed(1)}px;`;
      $game.appendChild(p);
      setTimeout(() => p.remove(), 650);
    }
    return { cx, cy };
  }

  function checkFever() {
    const now = Date.now();
    recentKills.push(now);
    recentKills = recentKills.filter(t => now - t <= 500);
    if      (recentKills.length >= 11) activateFever(2);
    else if (recentKills.length >= 7)  activateFever(1);
  }

  function checkSpeedBoost() {
    const now = Date.now();
    recentKillsSpeed.push(now);
    recentKillsSpeed = recentKillsSpeed.filter(t => now - t <= 1000);
    if (recentKillsSpeed.length >= speedBoostNextThresh) {
      speedBoostCount++;
      speedBoostNextThresh += 5;
    }
  }

  function activateFever(level) {
    clearTimeout(feverTimer);
    const wasInFever = feverMode;
    const wasLv2    = $game.classList.contains('fever-lv2');
    // ダウングレードしない（Lv2中にLv1条件を満たしてもLv2を維持）
    if (wasLv2 && level < 2) {
      feverTimer = setTimeout(() => {
        feverMode = false;
        $game.classList.remove('fever', 'fever-lv2');
      }, 5000);
      return;
    }
    const isLv2 = level >= 2;
    feverMode = true;
    $game.classList.add('fever');
    if (isLv2) $game.classList.add('fever-lv2');
    // ラベル表示: 新規覚醒 or Lv1→Lv2昇格
    if (!wasInFever || (isLv2 && !wasLv2)) {
      const el = document.createElement('div');
      el.className = 'fever-label' + (isLv2 ? ' fever-label-lv2' : '');
      el.textContent = isLv2 ? '⚡ 覚醒Ⅱ ⚡' : '⚡ 覚醒 ⚡';
      $game.appendChild(el);
      setTimeout(() => el.remove(), 1350);
    }
    feverTimer = setTimeout(() => {
      feverMode = false;
      $game.classList.remove('fever', 'fever-lv2');
    }, 5000);
  }

  /* ── Shooter ── */
  function updateShipPosition() {
    const ship = document.getElementById('playerShip');
    if (ship) ship.style.left = (playerX - 56) + 'px';
  }

  function getFireInterval() {
    let base = powerUpActive && powerUpType === 'rapidfire' ? 100 : 280;
    if ($game.classList.contains('fever-lv2')) return Math.min(base, 140);
    if ($game.classList.contains('fever')) return Math.min(base, 200);
    return base;
  }

  function fireBullet() {
    if (gameOver) return;
    const bw = 6, bh = 20;
    const y = window.innerHeight - 30 - 112 - bh;
    const makeEl = (x) => {
      const el = document.createElement('div');
      el.className = 'bullet';
      el.style.left = (x - bw / 2) + 'px';
      el.style.top  = y + 'px';
      $game.appendChild(el);
      return el;
    };
    const isSpread = powerUpActive && powerUpType === 'spread';
    const isLv2    = $game.classList.contains('fever-lv2');
    if (isLv2 && isSpread) {
      [[-5,-4],[-3,-5],[0,-6],[3,-5],[5,-4]].forEach(([vx, vy]) => {
        const el = makeEl(playerX); bullets.push({ el, x: playerX - bw/2, y, vx, vy });
      });
    } else if (isLv2 || isSpread) {
      [[-4,-5],[0,-6],[4,-5]].forEach(([vx, vy]) => {
        const el = makeEl(playerX); bullets.push({ el, x: playerX - bw/2, y, vx, vy });
      });
    } else {
      const el = makeEl(playerX);
      bullets.push({ el, x: playerX - bw / 2, y, vx: 0, vy: -6 });
    }
  }

  function fireBulletLoop() {
    if (gameOver) return;
    fireBullet();
    fireTimer = setTimeout(fireBulletLoop, getFireInterval());
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      b.el.style.left = b.x + 'px';
      b.el.style.top  = b.y + 'px';
      if (b.y < -30) { b.el.remove(); bullets.splice(i, 1); }
    }
  }

  function updateEnemies() {
    const hudH      = ($game.querySelector('.game-hud') || {}).offsetHeight || 56;
    const bottomLim = window.innerHeight - 80;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (!e.el.isConnected || e.el.classList.contains('bursting') || e.el.classList.contains('pre-burst')) {
        enemies.splice(i, 1); continue;
      }
      e.x += e.vx;
      e.x = Math.max(0, Math.min(window.innerWidth - e.size, e.x));
      e.y += e.vy;
      // 画面下端でバウンス（敵が逃げない）
      if (e.y + e.size > bottomLim) {
        e.y = bottomLim - e.size;
        e.vy = -Math.abs(e.vy) * 0.75;
        e.vx += (Math.random() - 0.5) * 0.6;
      }
      // 上端はHUDより下に留める
      if (e.y < hudH) { e.y = hudH; e.vy = Math.abs(e.vy); }
      e.el.style.left = e.x + 'px';
      e.el.style.top  = e.y + 'px';
    }
  }

  function checkCollisions() {
    const bh = 20;
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      const bx1 = b.x, by1 = b.y, bx2 = b.x + 6, by2 = b.y + bh;
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        if (e.el.classList.contains('bursting') || e.el.classList.contains('pre-burst')) continue;
        if (bx2 > e.x && bx1 < e.x + e.size && by2 > e.y && by1 < e.y + e.size) {
          const hx = (bx1 + bx2) / 2, hy = (by1 + by2) / 2;
          b.el.remove(); bullets.splice(bi, 1);
          enemies.splice(ei, 1);
          createHitSpark(hx, hy);
          flashHitRim();
          playHitLight();
          showCombo(hx, hy - 20);
          navigator.vibrate?.(18);
          triggerBurst(e.el);
          break;
        }
      }
    }
  }

  /* ── Stage system ── */
  function showStageLabel(text) {
    const el = document.createElement('div');
    el.className = 'stage-label';
    el.textContent = text;
    $game.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  }
  function playStageUp() {
    try {
      const ctx = getCtx(); if (!ctx) return;
      [440, 550, 660].forEach((freq, i) => {
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination); osc.type = 'triangle';
        const t = ctx.currentTime + i * 0.12;
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
      });
    } catch (_) {}
  }
  /* ── Power-up items ── */
  function spawnPowerUp() {
    if (gameOver) return;
    const W    = window.innerWidth;
    const hudH = $game.querySelector('.game-hud').offsetHeight || 56;
    const size = 48;
    const types = [
      { icon: '⭐', type: 'rapidfire' },
      { icon: '💥', type: 'spread' },
    ];
    const chosen = types[Math.floor(Math.random() * types.length)];
    const el = document.createElement('div');
    el.className = 'power-item';
    el.style.width  = size + 'px';
    el.style.height = size + 'px';
    el.textContent  = chosen.icon;
    el.dataset.powerType = chosen.type;
    const x = 16 + Math.random() * Math.max(0, W - 32 - size);
    const y = hudH - size;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    $game.appendChild(el);
    powerItems.push({ el, x, y, vx: (Math.random() - 0.5) * 0.6, vy: 1.0, size });
    if (!gameOver) powerSpawnTimer = setTimeout(spawnPowerUp, 12000 + Math.random() * 8000);
  }
  function updatePowerItems() {
    for (let i = powerItems.length - 1; i >= 0; i--) {
      const p = powerItems[i];
      if (!p.el.isConnected) { powerItems.splice(i, 1); continue; }
      p.x += p.vx;
      p.x = Math.max(0, Math.min(window.innerWidth - p.size, p.x));
      p.y += p.vy;
      p.el.style.left = p.x + 'px';
      p.el.style.top  = p.y + 'px';
      if (p.y > window.innerHeight + 20) { p.el.remove(); powerItems.splice(i, 1); }
    }
  }
  function checkPowerCollisions() {
    const bh = 20;
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      const bx1 = b.x, by1 = b.y, bx2 = b.x + 6, by2 = b.y + bh;
      for (let pi = powerItems.length - 1; pi >= 0; pi--) {
        const p = powerItems[pi];
        if (bx2 > p.x && bx1 < p.x + p.size && by2 > p.y && by1 < p.y + p.size) {
          b.el.remove(); bullets.splice(bi, 1);
          const pType = p.el.dataset.powerType;
          const px = p.x + p.size / 2, py = p.y + p.size / 2;
          p.el.remove(); powerItems.splice(pi, 1);
          activatePowerUp(pType, px, py);
          break;
        }
      }
    }
  }
  function activatePowerUp(type, cx, cy) {
    clearTimeout(powerUpTimer);
    powerUpActive = true;
    powerUpType   = type;
    navigator.vibrate?.([40, 30, 80]);
    const names = { rapidfire: '⭐ 連射強化！', spread: '💥 拡散弾！' };
    const labelEl = document.getElementById('powerUpLabel');
    labelEl.textContent = names[type] || 'パワーアップ！';
    labelEl.className = 'active';
    try {
      const ctx = getCtx(); if (ctx) {
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination); osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.18);
        g.gain.setValueAtTime(0.4, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
      }
    } catch (_) {}
    const fl = document.createElement('div');
    fl.className = 'float-score';
    fl.style.cssText = `color:#00ffee;font-size:1.4rem;left:${cx - 55}px;top:${cy - 20}px;`;
    fl.textContent = names[type];
    $game.appendChild(fl);
    setTimeout(() => fl.remove(), 1000);
    powerUpTimer = setTimeout(() => {
      powerUpActive = false; powerUpType = null;
      document.getElementById('powerUpLabel').className = '';
    }, 10000);
  }

  function createShatter(el) {
    const imgEl = el.querySelector('img');
    if (!imgEl) return;
    const rect  = el.getBoundingClientRect();
    const gr    = $game.getBoundingClientRect();
    const ex    = rect.left - gr.left;
    const ey    = rect.top  - gr.top;
    const iSize = parseInt(el.style.width) || SIZE;
    const cols  = 4, rows = 4;
    const fw    = iSize / cols;
    const fh    = iSize / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const shard = document.createElement('div');
        shard.className = 'shard';
        shard.style.width             = fw + 'px';
        shard.style.height            = fh + 'px';
        shard.style.left              = (ex + c * fw) + 'px';
        shard.style.top               = (ey + r * fh) + 'px';
        shard.style.backgroundImage   = `url(${imgEl.src})`;
        shard.style.backgroundSize    = `${iSize}px ${iSize}px`;
        shard.style.backgroundPosition= `-${(c * fw).toFixed(1)}px -${(r * fh).toFixed(1)}px`;
        const dx  = (c + 0.5) * fw - iSize / 2;
        const dy  = (r + 0.5) * fh - iSize / 2;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const spd = 55 + Math.random() * 85;
        shard.style.setProperty('--tx',  (dx / len * spd).toFixed(1) + 'px');
        shard.style.setProperty('--ty',  (dy / len * spd).toFixed(1) + 'px');
        shard.style.setProperty('--rot', (Math.random() * 400 - 200).toFixed(1) + 'deg');
        $game.appendChild(shard);
        setTimeout(() => shard.remove(), 580);
      }
    }
  }

/* ── タイマー ── */
  function tickTimer() {
    if (!gameOver) {
      const elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
      document.getElementById('hudTimer').textContent = elapsed.toFixed(2);
      updateBullets();
      updateEnemies();
      updatePowerItems();
      checkCollisions();
      checkPowerCollisions();
    }
    rafId = requestAnimationFrame(tickTimer);
  }
  function stopTimer() { cancelAnimationFrame(rafId); rafId = null; }

  /* ── アイテム生成 ── */
  function spawnItem() {
    const cfg = STAGE_CONFIGS[currentStageNum - 1];
    if (gameOver || totalSpawned >= cfg.spawnLimit) return;
    totalSpawned++;

    const hudH = $game.querySelector('.game-hud').offsetHeight || 56;
    const W    = window.innerWidth;

    const el = document.createElement('div');
    el.className = 'tap-item';

    const overlay = document.createElement('div');
    overlay.className = 'tap-overlay';
    el.appendChild(overlay);

    let itemSize = SIZE;
    let vy;
    if (heroImgSrcs.length > 0) {
      const pool = heroImgSrcs.filter(s => cfg.srcs.includes(s));
      const src  = (pool.length > 0 ? pool : heroImgSrcs)[Math.floor(Math.random() * (pool.length || heroImgSrcs.length))];
      if (src === 'IMG_3716.png') itemSize = Math.round(SIZE * 1.28);
      else itemSize = Math.round(SIZE * 0.72);
      el.dataset.src = src;
      const img = document.createElement('img');
      img.src = src; img.draggable = false;
      el.appendChild(img);
      vy = cfg.vyMin + Math.random() * (cfg.vyMax - cfg.vyMin);
    } else {
      el.style.fontSize   = itemSize * 0.7 + 'px';
      el.style.lineHeight = '1';
      el.insertAdjacentText('beforeend', EMOJIS[itemIndex++ % EMOJIS.length]);
      vy = 1.0 + Math.random() * 1.0;
    }
    el.style.width  = itemSize + 'px';
    el.style.height = itemSize + 'px';

    const sideMargin = 16;
    const x = sideMargin + Math.random() * Math.max(0, W - sideMargin * 2 - itemSize);
    const y = hudH - itemSize - 4;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';

    const vx = (Math.random() - 0.5) * 1.2;

    el.classList.add('spawning');
    el.addEventListener('animationend', () => el.classList.remove('spawning'), { once: true });
    $game.appendChild(el);
    enemies.push({ el, x, y, vx, vy, size: itemSize });
  }

  function triggerBurst(el) {
    if (gameOver) return;
    if (el.classList.contains('bursting') || el.classList.contains('pre-burst')) return;
    el.classList.add('pre-burst');
    navigator.vibrate?.(50);
    setTimeout(() => {
      if (!el.isConnected) return;
      createShatter(el);
      const { cx, cy } = createBurst(el);
      const isMilestone = (score + 1) % 10 === 0;
      playBurst(isMilestone);
      shakeScreen();
      el.classList.remove('pre-burst');
      el.classList.add('bursting');
      score++;
      checkFever();
      checkSpeedBoost();
      const cfg = STAGE_CONFIGS[currentStageNum - 1];
      showFloatScore(cx, cy, score);
      document.getElementById('hudScore').textContent  = `💥 ${score}体撃破`;
      document.getElementById('hudRemain').textContent = `残り ${Math.max(0, cfg.quota - score)}体`;
      if (score >= cfg.quota) {
        gameWon = true; gameOver = true;
        stopSpawn(); stopTimer();
        // 残り敵を即時消去
        enemies.forEach(e => { if (e.el.isConnected) e.el.remove(); }); enemies = [];
        setTimeout(() => { if (el.isConnected) el.remove(); endGame(); }, 430);
        return;
      }
      setTimeout(() => el.remove(), 430);
    }, 80);
  }

  function getSpawnInterval() {
    let mult = Math.max(0.45, Math.pow(0.88, speedBoostCount));
    if ($game.classList.contains('fever-lv2')) mult *= 0.72;
    return Math.max(300, Math.round(SPAWN_INTERVAL_MS * mult));
  }

  function spawnLoop() {
    const cfg = STAGE_CONFIGS[currentStageNum - 1];
    if (gameOver || totalSpawned >= cfg.spawnLimit) return;
    spawnItem();
    if (totalSpawned < cfg.spawnLimit) {
      spawnTimerId = setTimeout(spawnLoop, getSpawnInterval());
    }
  }

function runCountdown(cb) {
    const el = document.getElementById('countdown');
    const steps = ['3','2','1','GO!'];
    let i = 0;
    function next() {
      el.innerHTML = '';
      if (i >= steps.length) { cb(); return; }
      const step = steps[i++];
      const num = document.createElement('div');
      num.className = 'cd-num' + (step === 'GO!' ? ' cd-go' : '');
      num.textContent = step;
      el.appendChild(num);
      playCountdownBeep(step === 'GO!');
      setTimeout(next, 850);
    }
    next();
  }

  function stopSpawn() {
    clearTimeout(spawnTimerId);
    spawnTimerId = null;
  }

  /* ── ゲーム開始 ── */
  function startStage(stageNum) {
    currentStageNum = stageNum;
    const cfg = STAGE_CONFIGS[currentStageNum - 1];
    stopBGM();
    document.getElementById('dangerOverlay').classList.remove('active');

    speedBoostCount      = 0;
    speedBoostNextThresh = 5;
    recentKillsSpeed     = [];
    clearTimeout(feverTimer);
    clearTimeout(fireTimer);
    clearTimeout(powerUpTimer);
    clearTimeout(powerSpawnTimer);

    powerItems.forEach(p => { if (p.el.isConnected) p.el.remove(); }); powerItems = [];

    showScreen($game);

    setTimeout(() => playStageUp(), 100);
    runCountdown(() => {
      startTime     = Date.now();
      tiltSmoothed  = null;
      playerX       = window.innerWidth / 2;
      updateShipPosition();
      startBGM();
      for (let i = 0; i < INITIAL_SPAWN; i++) spawnItem();
      spawnTimerId = setTimeout(spawnLoop, SPAWN_INTERVAL_MS);
      fireBulletLoop();
      powerSpawnTimer = setTimeout(spawnPowerUp, 7000 + Math.random() * 5000);
      rafId = requestAnimationFrame(tickTimer);
    });
  }
  function startGame() { startStage(1); }

  /* ── ゲーム終了 ── */
  function endGame() {
    stopTimer();
    clearTimeout(fireTimer); clearTimeout(powerSpawnTimer); clearTimeout(powerUpTimer);
    fireTimer = null; powerSpawnTimer = null;
    bullets.forEach(b => b.el.remove()); bullets = [];
    enemies.forEach(e => { if (e.el.isConnected) e.el.remove(); }); enemies = [];
    powerItems.forEach(p => { if (p.el.isConnected) p.el.remove(); }); powerItems = [];
    $game.querySelectorAll('.tap-item,.particle').forEach(e => e.remove());
    document.getElementById('dangerOverlay').classList.remove('active');
    stopBGM();

    const stageElapsed = startTime ? (Date.now() - startTime) / 1000 : 99;
    totalScore  += score;
    totalElapsed += stageElapsed;

    // ステージクリア → 次ステージへ
    if (gameWon && currentStageNum < STAGE_CONFIGS.length) {
      playClear();
      showStageResult(true, stageElapsed);
      return;
    }

    // 0体（ステージ1のみ判定）
    if (!gameWon && currentStageNum === 1 && score === 0) {
      gameEndType = 'conquest';
      const msg = document.getElementById('conquestMsg');
      msg.classList.add('show');
      setTimeout(() => {
        msg.classList.remove('show'); msg.classList.add('hide');
        setTimeout(() => { msg.classList.remove('hide'); showResult(); }, 520);
      }, 2200);
      return;
    }

    // 全ステージクリア or 失敗
    if (gameWon && currentStageNum === STAGE_CONFIGS.length) {
      gameEndType = totalElapsed < 55 ? 'overwhelm' : 'win';
      playClear();
      const flash = document.getElementById('clearFlash');
      flash.classList.remove('flashing'); void flash.offsetWidth; flash.classList.add('flashing');
      setTimeout(() => showResult(), 500);
    } else {
      gameEndType = 'lose';
      showStageResult(false, stageElapsed);
    }
  }

  function showStageResult(won, elapsed) {
    const cfg = STAGE_CONFIGS[currentStageNum - 1];

    document.getElementById('stgResTitle').textContent = won ? 'CLEAR！' : 'FAILED';
    document.getElementById('stgResTitle').style.color = won ? '#ffd200' : '#ff3300';
    document.getElementById('stgResScore').textContent = score;
    document.getElementById('stgResDetail').textContent = `体撃破 / 目標 ${cfg.quota}体`;
    document.getElementById('stgResTime').textContent  = `クリアタイム ${elapsed.toFixed(1)}秒`;
    if (won) {
      document.getElementById('nextStageBtn').textContent = `STAGE ${currentStageNum + 1} へ ▶`;
    } else {
      document.getElementById('nextStageBtn').textContent = 'もう一度 ▶';
    }

  }

  /* ── スコア保存・ランキング ── */
  function loadScores() {
    try { return JSON.parse(localStorage.getItem('tg_v3') || '[]'); } catch { return []; }
  }
  function saveScore(won, elapsed, count) {
    const list = loadScores();
    list.push({ won, time: won ? elapsed : null, score: count });
    list.sort((a, b) => {
      if (a.won && !b.won) return -1;
      if (!a.won && b.won) return 1;
      if (a.won && b.won) return a.time - b.time; // タイム短い順
      return b.score - a.score;                   // 撃破数多い順
    });
    localStorage.setItem('tg_v3', JSON.stringify(list.slice(0, 20)));
  }
  function wonRankOf(elapsed) {
    return loadScores().filter(r => r.won && r.time < elapsed).length + 1;
  }
  function renderLb(id) {
    const el  = document.getElementById(id);
    const best = loadScores().slice(0, 1)[0];
    if (!best) {
      el.innerHTML = '<div class="lb-title">🥇 ベスト</div><div class="lb-empty">まだ記録なし</div>';
      return;
    }
    el.innerHTML = '<div class="lb-title">🥇 ベスト</div>' +
      `<div class="lb-row">
         <span class="lb-medal">🥇</span>
         <span class="lb-name">${best.won ? '全滅クリア' : `${best.score}体撃破`}</span>
         <span class="lb-score">${best.won ? best.time.toFixed(1)+'秒' : best.score+'/99'}</span>
       </div>`;
  }

  /* ── エンディング履歴 ── */

    { key: 'overwhelm', icon: '🏆', label: '圧倒的勝利'     },
    { key: 'win',       icon: '🎉', label: '通常勝利'        },
    { key: 'lose',      icon: '💀', label: '通常敗北'        },
    { key: 'conquest',  icon: '🌍', label: '圧倒的トキワ'  },
  ];
  function loadEndings() {
    try { return JSON.parse(localStorage.getItem('tg_endings') || '{}'); } catch { return {}; }
  }
  function saveEnding(type) {
    const e = loadEndings(); e[type] = (e[type] || 0) + 1;
    localStorage.setItem('tg_endings', JSON.stringify(e));

  function renderEndingHistory(id) {

    document.getElementById(id).innerHTML =
      '<div class="lb-title">📋 エンディング履歴</div>' +

           <span class="lb-medal">${p.icon}</span>
           <span class="lb-name">${p.label}</span>
           <span class="lb-score">${e[p.key] || 0}回</span>
         </div>`
      ).join('');

  /* ── リザルト ── */
  function showResult() {
    const elapsed = totalElapsed;
    saveEnding(gameEndType);
    if (gameWon) {
      const rank = wonRankOf(elapsed);
      saveScore(true, elapsed, totalScore);
      document.getElementById('resLogo').textContent  = '🎉';
      document.getElementById('resTitle').textContent = gameEndType === 'overwhelm' ? '圧倒的勝利！' : 'WIN';
      document.getElementById('resTitle').className   = 'result-win';
      document.getElementById('resScore').textContent = elapsed.toFixed(1);
      document.getElementById('resLabel').textContent = '秒で全ステージクリア！';
      const labels = { 1:'🥇 最速記録！', 2:'🥈 2位！', 3:'🥉 3位！' };
      document.getElementById('resRank').textContent  = labels[rank] || `第${rank}位`;
    } else {
      saveScore(false, null, totalScore);
      document.getElementById('resLogo').textContent  = '💀';
      document.getElementById('resTitle').textContent = 'LOSE';
      document.getElementById('resTitle').className   = 'result-lose';
      document.getElementById('resScore').textContent = totalScore;
      document.getElementById('resLabel').textContent = `体撃破（STAGE ${currentStageNum} 失敗）`;
      const msg = totalScore < 10 ? 'ファイト！' : totalScore < 25 ? 'もう少し！' : 'あと一歩！';
      document.getElementById('resRank').textContent  = msg;
    }
    renderLb('resLb');
    renderEndingHistory('resEndingHistory');
    showScreen($result);
  }

  /* ── ストーリーBGM ── */
  let storyBgm = null;
  function playStoryBgm() {
    if (storyBgm) { storyBgm.pause(); storyBgm.currentTime = 0; }
    storyBgm = new Audio('tokiwa-echo.mp3');
    storyBgm.loop = false;
    storyBgm.volume = 0.8;
    storyBgm.play().catch(() => {});
  }
  function stopStoryBgm() {
    if (!storyBgm) return;
    storyBgm.pause();
    storyBgm.currentTime = 0;
    storyBgm = null;
  }

  /* ── ボタン ── */
  function showStory(onDone) {
    showScreen($story);
    stopBGM();        // ゲームBGM確実停止
    stopStoryBgm();   // 前回の残りも停止
    const crawl   = document.getElementById('crawlText');
    const intro   = document.getElementById('storyIntro');
    const skipBtn = document.getElementById('storySkipBtn');

    const logoEl = document.getElementById('storyLogo');

    // アニメーションをリセット
    [crawl, intro].forEach(el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
    logoEl.classList.remove('visible');
    skipBtn.textContent = 'スキップ ▶';
    skipBtn.className = 'btn btn-secondary';
    $story.style.cursor = 'default';
    $story.onclick = null;

    // クロール開始（3s遅延）と同タイミングでBGM再生
    setTimeout(() => playStoryBgm(), 2000);
    // クロール開始7秒後にロゴ表示（3s + 7s = 10s）
    const logoTimer = setTimeout(() => logoEl.classList.add('visible'), 10000);

    const showProceed = () => {
      skipBtn.textContent = '今　自由をかけた戦いが始まる';
      skipBtn.className = 'btn btn-primary proceed';
      $story.onclick = proceed;
      $story.style.cursor = 'pointer';
    };

    const proceed = () => {
      $story.onclick = null;
      clearTimeout(fallbackTimer);
      clearTimeout(logoTimer);
      logoEl.classList.remove('visible');
      stopStoryBgm();
      onDone();
    };

    // animationend でクロール完了を検知（確実）
    crawl.addEventListener('animationend', showProceed, { once: true });
    // フォールバック（animationendが発火しない場合）
    const fallbackTimer = setTimeout(showProceed, 16500);

    skipBtn.onclick = (e) => {
      e.stopPropagation();
      crawl.removeEventListener('animationend', showProceed);
      clearTimeout(fallbackTimer);
      proceed();
    };
  }

  /* ── 傾き操作 ── */
  let tiltSmoothed = null;
  function handleTilt(e) {
    if (gameOver || !startTime) return;
    const gamma = e.gamma; // 左右傾き: 左=-90 右=90
    if (gamma === null) return;
    tiltSmoothed = tiltSmoothed === null ? gamma : tiltSmoothed * 0.65 + gamma * 0.35;
    const range = 28; // この角度で画面端まで移動
    const ratio = Math.max(-1, Math.min(1, tiltSmoothed / range));
    playerX = window.innerWidth / 2 + ratio * (window.innerWidth / 2 - 40);
    updateShipPosition();
  }
  async function enableTilt() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const state = await DeviceOrientationEvent.requestPermission();
        if (state === 'granted') window.addEventListener('deviceorientation', handleTilt);
      } catch (_) {}
    } else if (typeof DeviceOrientationEvent !== 'undefined') {
      window.addEventListener('deviceorientation', handleTilt);
    }
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    initAudio(); unlockBGM();
    enableTilt();
    showStory(() => playIntroVideo(() => startGame()));
  });
  document.getElementById('retryBtn').addEventListener('click', () => { initAudio(); unlockBGM(); startGame(); });
  document.getElementById('nextStageBtn').addEventListener('click', () => {
    initAudio();
    const won = document.getElementById('nextStageBtn').textContent.includes('STAGE');
    if (won) startStage(currentStageNum + 1);
    else startGame();
  });
  // ゲーム画面タップのたびにAudioContext再開（iOS対策）
  document.getElementById('gameScreen').addEventListener('pointerdown', () => initAudio(), { capture: true });
  // 自機移動
  const moveShip = (e) => {
    if (gameOver || !startTime) return;
    playerX = Math.max(32, Math.min(window.innerWidth - 32, e.clientX));
    updateShipPosition();
  };
  document.getElementById('gameScreen').addEventListener('pointermove', moveShip);
  document.getElementById('gameScreen').addEventListener('pointerdown', moveShip);
  document.getElementById('backBtn').addEventListener('click', () => {
    renderLb('topLb');
    renderEndingHistory('topEndingHistory');
    showScreen($name);
  });

  /* ── 起動時 ── */
  (async () => {
    renderLb('topLb');
    renderEndingHistory('topEndingHistory');
    heroImgSrcs = (await Promise.all(
      HERO_SRCS.map(src => new Promise(resolve => {
        const img = new Image();
        img.onload  = () => resolve(src);
        img.onerror = () => resolve(null);
        img.src = src;
      }))
    )).filter(Boolean);
  })();
</script>
</body>
</html>
