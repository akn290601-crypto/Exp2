<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポモドーロタイマー</title>
  <style>
    :root {
      --work-color: #e74c3c;
      --short-color: #27ae60;
      --long-color: #2980b9;
      --bg-work: #fdedec;
      --bg-short: #eafaf1;
      --bg-long: #eaf4fb;
      --accent: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-work);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background 0.5s;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }
    h1 {
      font-size: 1.8rem;
      color: #2c3e50;
      margin-bottom: 0.3rem;
      letter-spacing: 0.05em;
    }
    .subtitle {
      color: #7f8c8d;
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
    }
    /* Mode tabs */
    .modes {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .mode-btn {
      padding: 0.45rem 1.1rem;
      border: 2px solid transparent;
      border-radius: 999px;
      background: white;
      color: #7f8c8d;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .mode-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .mode-btn:hover:not(.active) {
      border-color: var(--accent);
      color: var(--accent);
    }
    /* Timer circle */
    .timer-wrap {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto 2rem;
    }
    .timer-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .timer-svg circle {
      fill: none;
      stroke-width: 8;
    }
    .circle-bg { stroke: #e0e0e0; }
    .circle-fg {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.5s;
    }
    .timer-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      line-height: 1;
    }
    .timer-time {
      font-size: 4rem;
      font-weight: 700;
      color: #2c3e50;
      letter-spacing: -2px;
    }
    .timer-label {
      font-size: 0.85rem;
      color: #7f8c8d;
      margin-top: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    /* Pomodoro dots */
    .pomodoro-dots {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e0e0e0;
      transition: background 0.3s;
    }
    .dot.done { background: var(--accent); }
    /* Buttons */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .btn-main {
      padding: 0.9rem 3rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .btn-main:hover { opacity: 0.88; }
    .btn-main:active { transform: scale(0.97); }
    .btn-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #ccc;
      background: white;
      color: #7f8c8d;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    /* Settings */
    .settings-toggle {
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .settings-toggle:hover { color: #555; }
    .settings-panel {
      display: none;
      background: white;
      border-radius: 12px;
      padding: 1.2rem;
      box-shadow: 0 2px 15px rgba(0,0,0,0.1);
      margin-top: 1rem;
      text-align: left;
    }
    .settings-panel.open { display: block; }
    .settings-panel h3 {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }
    .setting-row label {
      font-size: 0.9rem;
      color: #444;
    }
    .setting-row input[type=number] {
      width: 64px;
      padding: 0.3rem 0.5rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
    }
    .setting-row input[type=number]:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn-apply {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.55rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn-apply:hover { opacity: 0.85; }
    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2c3e50;
      color: white;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.4s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🍅 ポモドーロ</h1>
  <p class="subtitle">集中と休憩のサイクルで生産性を高めましょう</p>

  <div class="modes">
    <button class="mode-btn active" data-mode="work">作業</button>
    <button class="mode-btn" data-mode="short">短い休憩</button>
    <button class="mode-btn" data-mode="long">長い休憩</button>
  </div>

  <div class="timer-wrap">
    <svg class="timer-svg" viewBox="0 0 260 260">
      <circle class="circle-bg" cx="130" cy="130" r="118"/>
      <circle class="circle-fg" id="progressCircle" cx="130" cy="130" r="118"
        stroke-dasharray="741.4" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-display">
      <div class="timer-time" id="timerDisplay">25:00</div>
      <div class="timer-label" id="modeLabel">作業時間</div>
    </div>
  </div>

  <div class="pomodoro-dots" id="pomodoroDotsContainer">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="controls">
    <button class="btn-icon" id="btnReset" title="リセット">↺</button>
    <button class="btn-main" id="btnStart">スタート</button>
    <button class="btn-icon" id="btnSkip" title="スキップ">⏭</button>
  </div>

  <button class="settings-toggle" id="settingsToggle">⚙ 設定</button>
  <div class="settings-panel" id="settingsPanel">
    <h3>タイマー設定（分）</h3>
    <div class="setting-row">
      <label>作業時間</label>
      <input type="number" id="setWork" min="1" max="60" value="25">
    </div>
    <div class="setting-row">
      <label>短い休憩</label>
      <input type="number" id="setShort" min="1" max="30" value="5">
    </div>
    <div class="setting-row">
      <label>長い休憩</label>
      <input type="number" id="setLong" min="1" max="60" value="15">
    </div>
    <div class="setting-row">
      <label>長休憩までの回数</label>
      <input type="number" id="setRounds" min="1" max="10" value="4">
    </div>
    <button class="btn-apply" id="btnApply">適用</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const CIRCUMFERENCE = 2 * Math.PI * 118; // 741.4

  const config = {
    work: 25,
    short: 5,
    long: 15,
    rounds: 4
  };

  const modeInfo = {
    work:  { label: '作業時間',  accent: '#e74c3c', bg: '#fdedec' },
    short: { label: '短い休憩',  accent: '#27ae60', bg: '#eafaf1' },
    long:  { label: '長い休憩',  accent: '#2980b9', bg: '#eaf4fb' }
  };

  let mode = 'work';
  let totalSeconds = config.work * 60;
  let remaining = totalSeconds;
  let running = false;
  let interval = null;
  let completedPomodoros = 0;

  const timerDisplay  = document.getElementById('timerDisplay');
  const modeLabel     = document.getElementById('modeLabel');
  const progressCircle = document.getElementById('progressCircle');
  const btnStart      = document.getElementById('btnStart');
  const btnReset      = document.getElementById('btnReset');
  const btnSkip       = document.getElementById('btnSkip');
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel  = document.getElementById('settingsPanel');
  const dotsContainer  = document.getElementById('pomodoroDotsContainer');

  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateDisplay() {
    timerDisplay.textContent = formatTime(remaining);
    document.title = `${formatTime(remaining)} - ポモドーロ`;
    const ratio = remaining / totalSeconds;
    progressCircle.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
  }

  function applyMode(m) {
    mode = m;
    const info = modeInfo[m];
    document.documentElement.style.setProperty('--accent', info.accent);
    document.body.style.background = info.bg;
    modeLabel.textContent = info.label;

    const mins = m === 'work' ? config.work : m === 'short' ? config.short : config.long;
    totalSeconds = mins * 60;
    remaining = totalSeconds;

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === m);
    });
    stopTimer();
    updateDisplay();
  }

  function startTimer() {
    running = true;
    btnStart.textContent = '一時停止';
    interval = setInterval(() => {
      remaining--;
      updateDisplay();
      if (remaining <= 0) {
        clearInterval(interval);
        running = false;
        onTimerEnd();
      }
    }, 1000);
  }

  function pauseTimer() {
    running = false;
    btnStart.textContent = 'スタート';
    clearInterval(interval);
  }

  function stopTimer() {
    running = false;
    btnStart.textContent = 'スタート';
    clearInterval(interval);
  }

  function resetTimer() {
    stopTimer();
    remaining = totalSeconds;
    updateDisplay();
  }

  function onTimerEnd() {
    playBeep();
    if (mode === 'work') {
      completedPomodoros++;
      updateDots();
      if (completedPomodoros % config.rounds === 0) {
        showToast('お疲れ様！長い休憩を取りましょう 🎉');
        applyMode('long');
      } else {
        showToast('作業完了！短い休憩を取りましょう ☕');
        applyMode('short');
      }
    } else {
      showToast('休憩終了！次のポモドーロを始めましょう 💪');
      applyMode('work');
    }
  }

  function updateDots() {
    const dots = dotsContainer.querySelectorAll('.dot');
    const cycle = completedPomodoros % config.rounds || (completedPomodoros > 0 ? config.rounds : 0);
    dots.forEach((dot, i) => {
      dot.classList.toggle('done', i < cycle);
    });
  }

  function rebuildDots() {
    dotsContainer.innerHTML = '';
    for (let i = 0; i < config.rounds; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      dotsContainer.appendChild(d);
    }
    updateDots();
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.setValueAtTime(660, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    } catch(e) {}
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // Event listeners
  btnStart.addEventListener('click', () => {
    running ? pauseTimer() : startTimer();
  });

  btnReset.addEventListener('click', resetTimer);

  btnSkip.addEventListener('click', () => {
    stopTimer();
    onTimerEnd();
  });

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => applyMode(btn.dataset.mode));
  });

  settingsToggle.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
  });

  document.getElementById('btnApply').addEventListener('click', () => {
    const w = parseInt(document.getElementById('setWork').value) || 25;
    const s = parseInt(document.getElementById('setShort').value) || 5;
    const l = parseInt(document.getElementById('setLong').value) || 15;
    const r = parseInt(document.getElementById('setRounds').value) || 4;
    config.work = Math.max(1, Math.min(60, w));
    config.short = Math.max(1, Math.min(30, s));
    config.long = Math.max(1, Math.min(60, l));
    config.rounds = Math.max(1, Math.min(10, r));
    rebuildDots();
    applyMode(mode);
    settingsPanel.classList.remove('open');
    showToast('設定を保存しました ✓');
  });

  // Init
  progressCircle.style.strokeDasharray = CIRCUMFERENCE;
  progressCircle.style.strokeDashoffset = 0;
  updateDisplay();
</script>
</body>
</html>
